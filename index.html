<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>ប្រព័ន្ធប្រតិទិនយាម - ជំនាន់មាំមួនបំផុត</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root { --primary: #004d40; --accent: #ff6f00; --bg: #eceff1; }
        body { font-family: 'Kantumruy Pro', sans-serif; background: var(--bg); margin: 0; padding: 5px; box-sizing: border-box; }
        
        .container { background: white; width: 100%; max-width: 1000px; margin: auto; padding: 10px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none; box-sizing: border-box; }
        
        .calendar-header { display: flex; justify-content: space-between; align-items: center; background: var(--primary); color: white; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
        .calendar-header h2 { font-size: 1.2rem; margin: 0; font-weight: 700; }

        /* Admin Section */
        .manage-box { background: #f1f8e9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1.5px solid #c8e6c9; text-align: center; }
        .input-group { display: flex; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; }
        input, select { padding: 12px; border: 1px solid #ccc; border-radius: 6px; flex: 1; font-family: inherit; font-size: 16px; min-width: 140px; }
        
        .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; justify-content: center; }
        .tag { background: white; padding: 6px 12px; border-radius: 20px; border: 1px solid #ddd; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }

        #displayBox { font-size: 2.2rem; font-weight: 800; color: var(--primary); min-height: 60px; margin-bottom: 10px; background: #fff; border: 2.5px dashed var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }

        /* --- ការកំណត់តារាងឱ្យស្មើអេក្រង់ទូរស័ព្ទ ១០០% --- */
        .table-responsive { 
            width: 100%; 
            overflow: hidden; 
            border: 1.5px solid #000; 
            background: #fff;
            box-sizing: border-box;
        }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            table-layout: fixed; 
        }

        th, td { 
            border: 1px solid #000; 
            padding: 8px 2px; 
            text-align: center; 
            font-size: 1.2rem; 
            font-weight: 400; 
            transition: background-color 0.15s ease;
        }

        th:nth-child(1), td:nth-child(1) { width: 10%; } 
        th:nth-child(2), td:nth-child(2) { width: 34%; text-align: left; padding-left: 5px; font-size: 0.95rem; } 
        
        th { background: #37474f; color: white; font-size: 0.85rem; }
        .group-header { background: #cfd8dc !important; text-align: left !important; padding-left: 10px; font-weight: 800; font-size: 1rem; color: #000; }
        .filled { 
            background: #e1f4fa !important; 
            color: #050505; 
            font-size: 1.0rem; 
            font-weight: 400; 
        }

        /* ក្រឡោនពេលកំពុងផ្សងសំណាង */
        .slot-spinning {
            background-color: #fff59d !important;
            color: #d84315 !important;
            font-weight: 700 !important;
            animation: pulse 0.2s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.06); }
        }

        /* Buttons Control */
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; justify-content: center; }
        .btn { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 800; font-family: inherit; font-size: 15px; text-transform: uppercase; width: 48%; }
        .btn-img { background: #f39c12; color: white; }
        .btn-excel { background: #2e7d32; color: white; }
        .btn-logout { background: #555; color: white; }
        .btn-start { background: var(--primary); color: white; width: 100%; margin-top: 10px; font-size: 1.1rem; }
        .btn-add { background: var(--accent); color: white; width: auto; flex: 0.4; }

        /* ប៊ូតុង Edit និង Delete */
        .btn-action-edit { cursor: pointer; color: #0288d1; margin-left: 6px; font-size: 0.95rem; }
        .btn-action-del { cursor: pointer; color: #e53935; margin-left: 6px; font-size: 1rem; font-weight: bold; }

        #loginOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--primary); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { background: white; padding: 30px; border-radius: 12px; width: 85%; max-width: 350px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1.5px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        
        .capture-padding { padding: 50px !important; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2 style="color:var(--primary); margin-top:0;">MILITARY SYSTEM</h2>
        <input type="text" id="username" placeholder="ឈ្មោះអ្នកប្រើប្រាស់ (admin)" autocomplete="off">
        <input type="password" id="password" placeholder="លេខសម្ងាត់ (123)" autocomplete="off">
        <button class="btn btn-start" id="loginBtn" onclick="checkLogin()">ចូលប្រើប្រាស់</button>
    </div>
</div>

<div class="container" id="mainApp">
    <div class="calendar-header">
        <button onclick="changeMonth(-1)" style="background:none; border:1px solid white; color:white; padding:6px 12px; border-radius:4px; font-weight:bold; cursor:pointer;">◀</button>
        <h2 id="monthTitle">---</h2>
        <button onclick="changeMonth(1)" style="background:none; border:1px solid white; color:white; padding:6px 12px; border-radius:4px; font-weight:bold; cursor:pointer;">▶</button>
    </div>

    <div id="adminPanel" class="manage-box" style="display:none;">
        <div class="input-group">
            <input type="text" id="nameIn" placeholder="បញ្ចូលឈ្មោះថ្មី...">
            <select id="groupIn">
                <option value="0">ក្រុមទី ១ (ប្រចាំបញ្ជា)</option>
                <option value="1">ក្រុមទី ២ (ប្រចាំការ)</option>
                <option value="2">ក្រុមទី ៣ (ប្រចាំថ្ងៃ)</option>
            </select>
            <button class="btn btn-add" onclick="addM()">+ បន្ថែម</button>
        </div>
        <div id="tagBox" class="tag-list"></div>
        <hr style="border:none; border-top:1px dashed #ccc; margin:12px 0;">
        <div id="displayBox">READY</div>
        <button id="startBtn" class="btn btn-start" onclick="startAuto()">🎲 ចាប់ផ្ដើមរៀបចំ (START)</button>
        <button class="btn" style="background:#78909c; color:white; width:100%; margin-top:5px;" onclick="resetData()">♻️ RESET ទិន្នន័យខែនេះ</button>
    </div>

    <div class="btn-group">
        <button class="btn btn-img" onclick="exportToImage()">🖼️ DOWNLOAD IMAGE</button>
        <button id="excelBtn" class="btn btn-excel" style="display:none;" onclick="exportToExcel()">📊 DOWNLOAD EXCEL</button>
        <button class="btn btn-logout" onclick="logout()">🚪 LOGOUT</button>
        <button class="btn" style="background:#444; color:white; width:100%" onclick="location.reload()">🔄 REFRESH SYSTEM</button>
    </div>

    <div class="table-responsive" id="captureArea" style="background: #fff;">
        <table id="dutyTable">
            <thead>
                <tr>
                    <th width="10%">ល.រ</th>
                    <th>ឈ្មោះ</th>
                    <th colspan="7">ថ្ងៃយាម</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDYEk9HCOL8ClUffxKsA1M2WEKCBSc4zlU",
        databaseURL: "https://my-duty-system-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "my-duty-system",
        appId: "1:430122553040:web:897c088b3d6a0b46f458d5"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let membersGroups = JSON.parse(localStorage.getItem('m_list_final_v2')) || [
        ["សោម-ទិ", "អ៊ុយ-សុផល", "ស្វាយ-ប៊ុននី", "ទិត-សិទ្ធា", "សៀង-ប៉ាច"],
        ["ជូ-ច័ន្ទថុល", "វិះ-អរុណ", "គឹម-សែនសេរី", "ហែម-ហែន", "អ៊ុន-ដារ៉េត"],
        ["សួន-ពៅ", "សិដ្ឋ-សុផាន់ណា", "នឿន-វណ្ណេត", "អ៊ុំ-រិទ្ធី", "ថំ-ធឿង"]
    ];
    let currentDate = new Date();

    window.onload = () => {
        const pInput = document.getElementById('password');
        const uInput = document.getElementById('username');
        if (pInput) {
            pInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') checkLogin();
            });
        }
        if (uInput) {
            uInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') checkLogin();
            });
        }

        const role = sessionStorage.getItem('userRole');
        if (role) {
            showApp(role);
        }
    };

    function checkLogin() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        
        let role = null;
        if (u === 'admin' && p === '123') {
            role = 'ADMIN';
        } else if (u === 'user' && p === '123') {
            role = 'USER';
        }

        if (role) {
            sessionStorage.setItem('userRole', role);
            showApp(role);
        } else {
            alert("ឈ្មោះអ្នកប្រើប្រាស់ ឬលេខសម្ងាត់មិនត្រឹមត្រូវទេ! (admin / 123)");
        }
    }

    function showApp(role) {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        if (role === 'ADMIN') {
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('excelBtn').style.display = 'inline-block';
        } else {
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('excelBtn').style.display = 'none';
        }
        loadData();
    }

    function logout() {
        sessionStorage.clear();
        location.reload();
    }

    function getMonthKey() {
        return "duty_" + currentDate.getFullYear() + "_" + currentDate.getMonth();
    }

    function loadData() {
        const months = ["មករា", "កុម្ភៈ", "មីនា", "មេសា", "ឧសភា", "មិថុនា", "កក្កដា", "សីហា", "កញ្ញា", "តុលា", "វិច្ឆិកា", "ធ្នូ"];
        document.getElementById('monthTitle').innerText = months[currentDate.getMonth()] + " " + currentDate.getFullYear();
        renderTags();
        db.ref(getMonthKey()).on('value', snap => renderTable(snap.val() || {}));
    }

    function renderTags() {
        const box = document.getElementById('tagBox');
        box.innerHTML = '';
        const role = sessionStorage.getItem('userRole');
        membersGroups.forEach((g, gi) => g.forEach((n, ni) => {
            box.innerHTML += `<div class="tag">
                <span>${n}</span>
                ${role === 'ADMIN' ? `
                    <span class="btn-action-edit" onclick="editM(${gi},${ni})" title="កែឈ្មោះ">✏️</span>
                    <span class="btn-action-del" onclick="delM(${gi},${ni})" title="លុបឈ្មោះ">×</span>
                ` : ''}
            </div>`;
        }));
        localStorage.setItem('m_list_final_v2', JSON.stringify(membersGroups));
    }

    function addM() {
        const n = document.getElementById('nameIn').value.trim();
        const gi = document.getElementById('groupIn').value;
        if(n) {
            membersGroups[gi].push(n);
            document.getElementById('nameIn').value = '';
            loadData();
        }
    }

    function editM(gi, ni) {
        const oldName = membersGroups[gi][ni];
        const newName = prompt("សូមបញ្ចូលឈ្មោះថ្មីជំនួស (« " + oldName + " ») ៖", oldName);
        if (newName && newName.trim() !== "" && newName.trim() !== oldName) {
            const trimmedName = newName.trim();
            db.ref(getMonthKey()).once('value', snap => {
                const val = snap.val() || {};
                if (val[oldName]) {
                    val[trimmedName] = val[oldName];
                    delete val[oldName];
                    db.ref(getMonthKey()).set(val);
                }
            });
            membersGroups[gi][ni] = trimmedName;
            localStorage.setItem('m_list_final_v2', JSON.stringify(membersGroups));
            loadData();
        }
    }

    function delM(gi, ni) {
        if(confirm("តើអ្នកពិតជាចង់លុបឈ្មោះសមាជិកនេះមែនទេ?")) {
            membersGroups[gi].splice(ni, 1);
            loadData();
        }
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        const titles = ["ប្រចាំបញ្ជា", "ប្រចាំការ", "ប្រចាំថ្ងៃ"];
        const role = sessionStorage.getItem('userRole');

        membersGroups.forEach((g, gi) => {
            tbody.innerHTML += `<tr><td colspan="9" class="group-header">ក្រុមទី ${gi+1} (${titles[gi]})</td></tr>`;
            g.forEach((n, ni) => {
                const days = data[n] || ["","","","","","",""];
                // ដាក់ data-name និង data-cell index ដើម្បីងាយស្រួល Update ម្ដងមួយក្រឡោនពេល Random
                let cellsHtml = days.map((d, cIndex) => 
                    `<td id="cell_${encodeURIComponent(n)}_${cIndex}" class="${d ? 'filled' : ''}">${d}</td>`
                ).join('');

                tbody.innerHTML += `<tr>
                    <td>${ni+1}</td>
                    <td style="text-align:left; padding-left:5px;">
                        ${n}
                        ${role === 'ADMIN' ? `<span class="btn-action-edit" onclick="editM(${gi},${ni})" title="កែប្រែឈ្មោះ">✏️</span>` : ''}
                    </td>
                    ${cellsHtml}
                </tr>`;
            });
        });
    }

    /* មុខងារ Random ផ្សងសំណាងម្ដងមួយក្រឡោន (Slot Machine / Cell by Cell) */
    async function startAuto() {
        const btn = document.getElementById('startBtn');
        btn.disabled = true;
        let flat = [];
        membersGroups.forEach((g, gi) => g.forEach(n => flat.push({n, gi})));
        let spinList = [...flat].sort(() => Math.random() - 0.5);
        let groupUsed = {g0:[], g1:[], g2:[]};

        // សម្អាតទិន្នន័យលើអេក្រង់មុនពេលចាប់ផ្ដើមផ្សងសំណាង
        const total = new Date(currentDate.getFullYear(), currentDate.getMonth()+1, 0).getDate();

        for(let item of spinList) {
            // ជំហានទី ១៖ វិលឈ្មោះផ្សងសំណាងក្នុង Display Box
            let timer = 0;
            while(timer < 300) {
                document.getElementById('displayBox').innerText = flat[Math.floor(Math.random()*flat.length)].n;
                await new Promise(r => setTimeout(r, 40));
                timer += 40;
            }
            document.getElementById('displayBox').innerText = "👉 " + item.n;

            // គណនាថ្ងៃចាប់ផ្ដើម
            let sDay = Math.floor(Math.random()*5)+1;
            while(groupUsed['g'+item.gi].includes(sDay)) sDay = (sDay%5)+1;
            groupUsed['g'+item.gi].push(sDay);

            let days = ["","","","","","",""];
            for(let d=sDay, c=0; d<=total && c<7; d+=5, c++) {
                days[c] = d.toString().padStart(2, '0');
            }

            // ជំហានទី ២៖ រត់វិលលេខកន្ត្រាក់ៗ ម្ដងមួយក្រឡោន (Cell by Cell Lucky Draw)
            for(let c = 0; c < 7; c++) {
                const targetDay = days[c];
                const cellElement = document.getElementById(`cell_${encodeURIComponent(item.n)}_${c}`);
                
                if (targetDay !== "") {
                    if (cellElement) {
                        cellElement.classList.add('slot-spinning');
                        // វិលលេខចៃដន្យក្នុងក្រឡោននេះ ៤ ទៅ ៥ ដង
                        for(let step = 0; step < 5; step++) {
                            const randomFakeNum = (Math.floor(Math.random() * total) + 1).toString().padStart(2, '0');
                            cellElement.innerText = randomFakeNum;
                            await new Promise(r => setTimeout(r, 45));
                        }
                        // ឈប់លើលេខជាក់លាក់ពិតប្រាកដ
                        cellElement.innerText = targetDay;
                        cellElement.classList.remove('slot-spinning');
                        cellElement.classList.add('filled');
                    }
                    await new Promise(r => setTimeout(r, 120)); // រង់ចាំបន្តិចមុនរត់ទៅក្រឡោនបន្ទាប់
                } else {
                    if (cellElement) {
                        cellElement.innerText = "";
                        cellElement.classList.remove('filled', 'slot-spinning');
                    }
                }
            }

            // រក្សាទុកចូល Firebase សម្រាប់សមាជិកនោះ
            await db.ref(getMonthKey()).update({[item.n]: days});
            await new Promise(r => setTimeout(r, 200));
        }

        document.getElementById('displayBox').innerText = "🎉 ចាប់ឆ្នោតរួចរាល់ ✨";
        btn.disabled = false;
    }

    function changeMonth(s) {
        currentDate.setMonth(currentDate.getMonth()+s);
        loadData();
    }

    function resetData() {
        if(confirm("តើអ្នកពិតជាចង់លុបទិន្នន័យខែនេះទាំងអស់ឡើងវិញមែនទេ?")) {
            db.ref(getMonthKey()).remove();
        }
    }

    function exportToExcel() {
        XLSX.writeFile(XLSX.utils.table_to_book(document.getElementById("dutyTable")), `Duty_${document.getElementById('monthTitle').innerText}.xlsx`);
    }

    function exportToImage() {
        const area = document.getElementById("captureArea");
        area.classList.add('capture-padding');
        
        const editBtns = document.querySelectorAll('.btn-action-edit');
        editBtns.forEach(el => el.style.display = 'none');

        html2canvas(area, { scale: 3, backgroundColor: "#ffffff" }).then(canvas => {
            area.classList.remove('capture-padding');
            editBtns.forEach(el => el.style.display = 'inline');
            const link = document.createElement('a');
            link.download = `Duty_${document.getElementById('monthTitle').innerText}.png`;
            link.href = canvas.toDataURL();
            link.click();
        });
    }
</script>
</body>
</html>
