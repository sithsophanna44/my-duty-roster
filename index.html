<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគ្រប់គ្រងការប្រចាំការ - Login System</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #004d40;
            --accent: #ff6f00;
            --bg-body: #eceff1;
            --bg-container: #ffffff;
            --text-main: #212121;
        }

        body { font-family: 'Kantumruy Pro', sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; padding: 10px; font-size: 16px; }
        .container { background: var(--bg-container); max-width: 1200px; margin: auto; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid #cfd8dc; display: none; }
        
        /* Login Styles */
        #loginOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--primary); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { background: white; padding: 30px; border-radius: 10px; width: 90%; max-width: 350px; text-align: center; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 12px; background: var(--accent); border: none; color: white; font-weight: bold; border-radius: 5px; cursor: pointer; }

        /* Header & Panels */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; background: var(--primary); color: white; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
        .manage-box, .spin-box { display: none; } /* លាក់ទុកសិន ចាំ Admin ចូលទើបបង្ហាញ */
        
        .manage-box { background: #f1f8e9; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #c8e6c9; }
        .input-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .input-group input, .input-group select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 150px; }
        
        .member-tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { background: white; padding: 5px 12px; border-radius: 20px; border: 1px solid #ddd; display: flex; align-items: center; gap: 8px; font-size: 14px; }

        .spin-box { text-align: center; border: 2px solid var(--primary); padding: 25px; border-radius: 10px; background: #fff; margin-bottom: 20px; }
        #displayBox { font-size: 2.5rem; font-weight: 700; color: var(--primary); min-height: 60px; }

        .table-wrapper { overflow-x: auto; }
        .duty-table { width: 100%; border-collapse: collapse; background: white; border: 2px solid #000; min-width: 800px; }
        .duty-table th, .duty-table td { border: 1.5px solid #000; padding: 12px; text-align: center; font-weight: 600; }
        .duty-table th { background: #37474f; color: white; }
        .group-header { background: #cfd8dc !important; text-align: left !important; padding-left: 20px; }
        .filled { background: #fff9c4 !important; color: #b71c1c; }
        .active-row { background: #e0f2f1 !important; border: 2.5px solid var(--accent) !important; }

        .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 15px; }
        .btn { padding: 12px 25px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: 700; font-family: inherit; }
        .btn-start { background: var(--primary); color: white; }
        .btn-excel { background: #2e7d32; color: white; }
        .btn-logout { background: #555; color: white; padding: 5px 10px; font-size: 12px; }
        .btn-nav { background: rgba(255,255,255,0.2); color: white; border: 1px solid white; padding: 5px 10px; cursor: pointer; border-radius: 4px; }

        @media (max-width: 600px) { .btn { width: 100%; } }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2 style="color: var(--primary);">ចូលប្រព័ន្ធ</h2>
        <input type="text" id="username" placeholder="ឈ្មោះអ្នកប្រើប្រាស់">
        <input type="password" id="password" placeholder="លេខសម្ងាត់">
        <button class="btn-login" onclick="checkLogin()">ចូល</button>
        <p id="loginError" style="color: red; font-size: 13px; margin-top: 10px; display: none;">ឈ្មោះ ឬលេខសម្ងាត់មិនត្រឹមត្រូវ!</p>
        <p style="font-size: 12px; color: #777; margin-top: 15px;">Admin: admin / 123<br>User: user / 123</p>
    </div>
</div>

<div class="container" id="mainApp">
    <div class="calendar-header">
        <button class="btn-nav" onclick="changeMonth(-1)">◀</button>
        <h2 id="monthTitle">---</h2>
        <div>
            <span id="userRole" style="font-size: 12px; margin-right: 10px;"></span>
            <button class="btn-logout" onclick="logout()">ចាកចេញ</button>
        </div>
        <button class="btn-nav" onclick="changeMonth(1)">▶</button>
    </div>

    <div id="adminPanel" class="manage-box">
        <div class="input-group">
            <input type="text" id="newNameInput" placeholder="ឈ្មោះសមាជិកថ្មី...">
            <select id="groupSelect">
                <option value="0">ក្រុមទី ១ (ប្រចាំបញ្ជា)</option>
                <option value="1">ក្រុមទី ២ (ប្រចាំការ)</option>
                <option value="2">ក្រុមទី ៣ (ប្រចាំថ្ងៃ)</option>
            </select>
            <button class="btn" style="background: var(--accent); color: white;" onclick="addMember()">+ បន្ថែមឈ្មោះ</button>
        </div>
        <div id="memberTags" class="member-tags"></div>
    </div>

    <div id="spinPanel" class="spin-box">
        <div id="displayBox">READY</div>
        <div id="statusMsg" style="font-weight: bold; margin-bottom: 15px;">ត្រៀមរៀបចំ</div>
        <button id="startBtn" class="btn btn-start" onclick="startStepByStep()">🎲 ចាប់ផ្ដើមរៀបចំ (Admin Only)</button>
    </div>

    <div class="btn-group">
        <button class="btn btn-excel" onclick="exportToExcel()">📊 Download Excel</button>
        <button id="resetBtn" class="btn" style="background: #78909c; color: white; display: none;" onclick="resetAll()">♻️ Reset Memory</button>
    </div>

    <div class="table-wrapper">
        <table class="duty-table" id="dutyTable">
            <thead>
                <tr>
                    <th width="60">ល.រ</th>
                    <th>នាម និង គោត្តនាម</th>
                    <th colspan="7">កាលបរិច្ឆេទយាម</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // ព័ត៌មាន Login (អ្នកអាចដូរនៅទីនេះ)
    const AUTH = {
        admin: { pass: "123", role: "ADMIN" },
        user: { pass: "123", role: "USER" }
    };

    let currentUser = null;
    let membersGroups = JSON.parse(localStorage.getItem('duty_members_list')) || [
        ["សោម-ទិ", "អ៊ុយ-សុផល", "ស្វាយ-ប៊ុននី", "ទិត-សិទ្ធា", "សៀង-ប៉ាច"],
        ["ជូ-ច័ន្ទថុល", "វិះ-អរុណ", "គឹម-សែនសេរី", "ឃឹម-លុច", "អ៊ុន-ដារ៉េត"],
        ["សួន-ពៅ", "ហែម-ហាន", "នឿន-វណ្ណេត", "អ៊ុំ-វិច្ឆិ", "អ៊ុន-មករា"]
    ];
    let currentDate = new Date();
    let groupUsedOffsets = { g0: [], g1: [], g2: [] };

    function checkLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        if (AUTH[u] && AUTH[u].pass === p) {
            currentUser = AUTH[u];
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            applyPermissions();
            init();
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    }

    function applyPermissions() {
        document.getElementById('userRole').innerText = "សិទ្ធិ៖ " + currentUser.role;
        if (currentUser.role === "ADMIN") {
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('spinPanel').style.display = 'block';
            document.getElementById('resetBtn').style.display = 'inline-block';
        } else {
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('spinPanel').style.display = 'none';
            document.getElementById('resetBtn').style.display = 'none';
        }
    }

    function logout() { location.reload(); }

    function getMonthKey(date) { return "duty_v3_" + date.getFullYear() + "_" + date.getMonth(); }

    function init() {
        const months = ["មករា", "កុម្ភៈ", "មីនា", "មេសា", "ឧសភា", "មិថុនា", "កក្កដា", "សីហា", "កញ្ញា", "តុលា", "វិច្ឆិកា", "ធ្នូ"];
        document.getElementById('monthTitle').innerText = "ខែ" + months[currentDate.getMonth()] + " ឆ្នាំ " + currentDate.getFullYear();
        renderMemberTags();
        renderTable();
    }

    function renderMemberTags() {
        const box = document.getElementById('memberTags');
        box.innerHTML = '';
        membersGroups.forEach((group, gIdx) => {
            group.forEach((name, nIdx) => {
                const tag = document.createElement('div');
                tag.className = 'tag';
                tag.innerHTML = `${name} ${currentUser.role==='ADMIN' ? `<button onclick="deleteMember(${gIdx},${nIdx})" style="color:red; border:none; background:none; cursor:pointer;">×</button>` : ''}`;
                box.appendChild(tag);
            });
        });
        localStorage.setItem('duty_members_list', JSON.stringify(membersGroups));
    }

    function addMember() {
        const name = document.getElementById('newNameInput').value.trim();
        const gIdx = document.getElementById('groupSelect').value;
        if (name && currentUser.role === 'ADMIN') {
            membersGroups[gIdx].push(name);
            document.getElementById('newNameInput').value = '';
            init();
        }
    }

    function deleteMember(gIdx, nIdx) {
        if (confirm("លុបឈ្មោះនេះ?") && currentUser.role === 'ADMIN') {
            membersGroups[gIdx].splice(nIdx, 1);
            init();
        }
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        const savedData = JSON.parse(localStorage.getItem(getMonthKey(currentDate))) || {};
        const titles = ["ក្រុមទី ១", "ក្រុមទី ២", "ក្រុមទី ៣"];
        membersGroups.forEach((group, gIdx) => {
            tbody.innerHTML += `<tr><td colspan="9" class="group-header">${titles[gIdx]}</td></tr>`;
            group.forEach((name, nIdx) => {
                const days = savedData[name] || ["","","","","","",""];
                tbody.innerHTML += `<tr id="row-${name.replace(/\s+/g,'-')}">
                    <td>${(nIdx+1).toString().padStart(2,'0')}</td>
                    <td style="text-align:left; padding-left:20px;">${name}</td>
                    ${days.map(d => `<td class="${d?'filled':''}">${d}</td>`).join('')}
                </tr>`;
            });
        });
    }

    async function startStepByStep() {
        if (currentUser.role !== 'ADMIN') return;
        document.getElementById('startBtn').disabled = true;
        groupUsedOffsets = { g0: [], g1: [], g2: [] };
        let flat = []; membersGroups.forEach((g, gi) => g.forEach(n => flat.push({n, gi})));
        let spinList = [...flat].sort(() => Math.random() - 0.5);
        let monthData = {};

        for (let i = 0; i < flat.length; i++) {
            const selected = await new Promise(res => {
                let t = 0;
                let itv = setInterval(() => {
                    document.getElementById('displayBox').innerText = spinList[Math.floor(Math.random()*spinList.length)].n;
                    if((t+=50)>600){ clearInterval(itv); res(document.getElementById('displayBox').innerText); }
                }, 50);
            });
            const mObj = flat.find(m => m.n === selected);
            monthData[selected] = fillData(selected, mObj.gi);
            spinList = spinList.filter(m => m.n !== selected);
            await new Promise(res => setTimeout(res, 800));
        }
        localStorage.setItem(getMonthKey(currentDate), JSON.stringify(monthData));
        document.getElementById('displayBox').innerText = "DONE!";
    }

    function fillData(name, gIdx) {
        const gKey = 'g' + gIdx;
        let startDay = Math.floor(Math.random()*5)+1;
        while(groupUsedOffsets[gKey].includes(startDay)) startDay = (startDay%5)+1;
        groupUsedOffsets[gKey].push(startDay);
        const total = new Date(currentDate.getFullYear(), currentDate.getMonth()+1, 0).getDate();
        const row = document.getElementById(`row-${name.replace(/\s+/g,'-')}`);
        if(row) row.classList.add('active-row');
        let days = ["","","","","","",""];
        for(let d=startDay, c=0; d<=total && c<7; d+=5, c++) {
            days[c] = d.toString().padStart(2,'0');
            if(row) { row.cells[c+2].innerText = days[c]; row.cells[c+2].classList.add('filled'); }
        }
        setTimeout(() => { if(row) row.classList.remove('active-row'); }, 800);
        return days;
    }

    function changeMonth(s) { currentDate.setMonth(currentDate.getMonth()+s); init(); }
    function resetAll() { if(confirm("Reset data?") && currentUser.role === 'ADMIN') { localStorage.removeItem(getMonthKey(currentDate)); init(); } }
    function exportToExcel() { XLSX.writeFile(XLSX.utils.table_to_book(document.getElementById("dutyTable")), `Duty.xlsx`); }
</script>
</body>
</html>
