<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ប្រព័ន្ធប្រតិទិនយាម - ជំនាន់រំភើបខ្លាំង</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root { --primary: #004d40; --accent: #ff6f00; --bg: #eceff1; }
        body { font-family: 'Kantumruy Pro', sans-serif; background: var(--bg); margin: 0; padding: 10px; }
        
        .container { background: white; max-width: 1200px; margin: auto; padding: 15px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none; }
        
        .calendar-header { display: flex; justify-content: space-between; align-items: center; background: var(--primary); color: white; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
        
        /* Manage Area */
        .manage-box { background: #f1f8e9; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #c8e6c9; text-align: center; }
        .input-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; justify-content: center; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 150px; font-family: inherit; }
        
        .tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; justify-content: center; }
        .tag { background: white; padding: 5px 10px; border-radius: 20px; border: 1px solid #ddd; font-size: 14px; display: flex; align-items: center; gap: 5px; }

        /* --- ផ្នែកវិលឈ្មោះបែបថ្មី --- */
        .spin-box { display: none; margin-bottom: 20px; }
        #displayBox { font-size: 3rem; font-weight: bold; color: var(--primary); min-height: 70px; margin: 10px 0; background: #fff; padding: 10px; border-radius: 8px; border: 2px solid var(--primary); }

        /* --- កែសម្រួលតារាងដើម្បីបន្ថែមសញ្ញាព្រួញ --- */
        .table-container { position: relative; width: 100%; overflow: hidden; } /* សម្រាប់ផ្ទុកសញ្ញាព្រួញ */
        
        /* សញ្ញាព្រួញចង្អុល */
        #pointer { 
            position: absolute; 
            left: -30px; /* ហើបចេញក្រៅតារាងបន្តិច */
            width: 0; height: 0; 
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-left: 25px solid var(--accent); /* ពណ៌ទឹកក្រូច Hazard */
            display: none; /* លាក់ទុកសិន */
            z-index: 10;
            filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.3));
        }

        .table-responsive { width: 100%; overflow-x: auto; border: 1.5px solid #000; background: #fff; box-sizing: border-box; }
        
        /* --- គែមធំទូលាយពេលថតរូប --- */
        .capture-padding { padding: 40px !important; } /* បន្ថែម padding ធំសម្រាប់ថតរូប */

        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { border: 1px solid #000; padding: 12px; text-align: center; font-size: 16px; position: relative; }
        th { background: #37474f; color: white; }
        
        /* ជួរដេកធម្មតា */
        tbody tr { height: 50px; transition: background 0.1s; } 

        .group-header { background: #cfd8dc !important; text-align: left !important; padding-left: 10px; font-weight: bold; height: 40px; }
        .filled { background: #fff9c4 !important; color: #b71c1c; font-weight: bold; }

        /* ហាយឡាយពេលចាប់បាន */
        .active-row { background: rgba(255, 111, 0, 0.2) !important; border: 2.5px solid var(--accent) !important; }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; justify-content: center; }
        .btn { padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-family: inherit; text-transform: uppercase; }
        .btn-img { background: #f39c12; color: white; }
        .btn-excel { background: #2e7d32; color: white; }
        .btn-logout { background: #555; color: white; }
        
        #loginOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--primary); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { background: white; padding: 30px; border-radius: 10px; width: 85%; max-width: 350px; text-align: center; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2>ចូលប្រព័ន្ធ</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button class="btn" style="background:var(--primary); color:white; width:100%; margin-top:10px;" onclick="checkLogin()">LOGIN</button>
    </div>
</div>

<div class="container" id="mainApp">
    <div class="calendar-header">
        <button onclick="changeMonth(-1)" style="background:none; border:1px solid white; color:white; cursor:pointer;">◀</button>
        <h2 id="monthTitle">---</h2>
        <button onclick="changeMonth(1)" style="background:none; border:1px solid white; color:white; cursor:pointer;">▶</button>
    </div>

    <div id="adminPanel" class="manage-box" style="display:none;">
        <div class="input-group">
            <input type="text" id="nameIn" placeholder="ឈ្មោះសមាជិក...">
            <select id="groupIn">
                <option value="0">ប្រចាំបញ្ជា</option>
                <option value="1">ប្រចាំការ</option>
                <option value="2">ប្រចាំថ្ងៃ</option>
            </select>
            <button class="btn" style="background:var(--accent); color:white;" onclick="addMember()">+ បន្ថែម</button>
        </div>
        <div id="memberTags" class="tag-list"></div>
        <hr>
        
        <div class="spin-box" id="spinArea">
            <div id="displayBox">DEPLOYMENT</div>
            <button id="startBtn" class="btn" style="background:var(--primary); color:white;" onclick="startExcitingDeployment()">🎲 ចាប់ផ្ដើមរៀបចំ (START)</button>
            <button class="btn" style="background:#78909c; color:white;" onclick="resetData()">♻️ Reset Data</button>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-img" onclick="exportToImage()">🖼️ Download IMAGE</button>
        <button id="excelBtn" class="btn btn-excel" style="display:none;" onclick="exportToExcel()">📊 Download Excel</button>
        <button class="btn btn-logout" onclick="logout()">🚪 Logout</button>
    </div>

    <div class="table-container">
        <div id="pointer"></div> <div id="captureArea" class="table-responsive">
            <table id="dutyTable">
                <thead>
                    <tr>
                        <th width="10%">ល.រ</th>
                        <th>នាម និង គោត្តនាម</th>
                        <th colspan="7">ថ្ងៃយាម</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // --- Config Firebase ---
    const firebaseConfig = {
        apiKey: "AIzaSyDYEk9HCOL8ClUffxKsA1M2WEKCBSc4zlU",
        databaseURL: "https://my-duty-system-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "my-duty-system",
        appId: "1:430122553040:web:897c088b3d6a0b46f458d5"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let membersGroups = JSON.parse(localStorage.getItem('m_list')) || [
        ["សោម-ទិ", "អ៊ុយ-សុផល", "ស្វាយ-ប៊ុននី", "ទិត-សិទ្ធា", "សៀង-ប៉ាច"],
        ["ជូ-ច័ន្ទថុល", "វិះ-អរុណ", "គឹម-សែនសេរី", "ឃឹម-លុច", "អ៊ុន-ដារ៉េត"],
        ["សួន-ពៅ", "ហែម-ហាន", "នឿន-វណ្ណេត", "អ៊ុំ-វិច្ឆិ", "អ៊ុន-មករា"]
    ];
    let currentDate = new Date();
    let isSpinning = false; // ស្ថានភាពកំពុងវិល

    window.onload = () => {
        const loggedInUser = sessionStorage.getItem('userRole');
        if (loggedInUser) { showApp(loggedInUser); }
    };

    function checkLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        let role = (u === 'admin' && p === '123') ? 'ADMIN' : (u === 'user' && p === '123' ? 'USER' : null);
        if (role) { sessionStorage.setItem('userRole', role); showApp(role); }
        else { alert("ខុស Username/Password!"); }
    }

    function showApp(role) {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        if (role === 'ADMIN') {
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('spinArea').style.display = 'block';
            document.getElementById('excelBtn').style.display = 'block';
        }
        loadData();
    }

    function logout() { sessionStorage.clear(); location.reload(); }

    function getMonthKey() { return "duty_" + currentDate.getFullYear() + "_" + currentDate.getMonth(); }

    function loadData() {
        const months = ["មករា", "កុម្ភៈ", "មីនា", "មេសា", "ឧសភា", "មិថុនា", "កក្កដា", "សីហា", "កញ្ញា", "តុលា", "វិច្ឆិកា", "ធ្នូ"];
        document.getElementById('monthTitle').innerText = months[currentDate.getMonth()] + " " + currentDate.getFullYear();
        renderMembers();
        db.ref(getMonthKey()).on('value', snap => renderTable(snap.val() || {}));
    }

    function renderMembers() {
        const box = document.getElementById('memberTags');
        box.innerHTML = '';
        membersGroups.forEach((g, gi) => g.forEach((n, ni) => {
            box.innerHTML += `<div class="tag">${n} <b onclick="delM(${gi},${ni})" style="color:red; cursor:pointer;">×</b></div>`;
        }));
        localStorage.setItem('m_list', JSON.stringify(membersGroups));
    }

    function addMember() {
        const n = document.getElementById('nameIn').value.trim();
        const gi = document.getElementById('groupIn').value;
        if(n) { membersGroups[gi].push(n); document.getElementById('nameIn').value=''; loadData(); }
    }

    function delM(gi, ni) { if(confirm("លុប?")) { membersGroups[gi].splice(ni, 1); loadData(); } }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        const titles = ["ប្រចាំបញ្ជា", "ប្រចាំការ", "ប្រចាំថ្ងៃ"];
        membersGroups.forEach((g, gi) => {
            tbody.innerHTML += `<tr><td colspan="9" class="group-header">ក្រុមទី ${gi+1} (${titles[gi]})</td></tr>`;
            g.forEach((n, ni) => {
                const days = data[n] || ["","","","","","",""];
                // បន្ថែម ID ឱ្យជួរនីមួយៗដើម្បីឱ្យព្រួញរត់ទៅរក
                tbody.innerHTML += `<tr id="row-${gi}-${ni}"><td>${ni+1}</td><td style="text-align:left;">${n}</td>${days.map(d=>`<td class="${d?'filled':''}">${d}</td>`).join('')}</tr>`;
            });
        });
    }

    // --- មុខងាររៀបចំអូតូ បែបរំភើបខ្លាំង ---
    async function startExcitingDeployment() {
        if(isSpinning) return;
        isSpinning = true;
        document.getElementById('startBtn').disabled = true;
        document.getElementById('displayBox').innerText = "កំពុងចាប់ឆ្នោត...";

        let flatList = []; 
        membersGroups.forEach((g, gi) => g.forEach((n, ni) => flatList.push({name: n, gIdx: gi, nIdx: ni})));
        
        let spinList = [...flatList].sort(() => Math.random() - 0.5);
        let results = {};
        let groupUsed = {g0:[], g1:[], g2:[]};

        const pointer = document.getElementById('pointer');
        const tbody = document.getElementById('tableBody');

        // ១. បង្វិលព្រួញចុះឡើងៗយ៉ាងលឿន (ដូច Slot Machine)
        pointer.style.display = 'block';
        let speed = 50; // ល្បឿនដើម
        for(let i=0; i<30; i++) { // វិល ៣០ ដង
            const randomRow = flatList[Math.floor(Math.random() * flatList.length)];
            movePointerToRow(randomRow.gIdx, randomRow.nIdx);
            await new Promise(r => setTimeout(r, speed));
            if(i > 20) speed += 10; // ពន្យឺតល្បឿននៅចុងក្រោយ
        }

        // ២. ចាប់ផ្ដើមជ្រើសរើសឈ្មោះម្តងម្នាក់ៗ
        for(let item of spinList) {
            // វិលឈ្មោះក្នុងប្រអប់
            document.getElementById('displayBox').innerText = item.name;
            
            // រំកិលព្រួញទៅរកជួរដែលត្រូវចាប់បាន
            movePointerToRow(item.gIdx, item.nIdx);
            
            // ហាយឡាយជួរនោះ
            const row = document.getElementById(`row-${item.gIdx}-${item.nIdx}`);
            row.classList.add('active-row');

            // គណនាថ្ងៃយាម
            let sDay = Math.floor(Math.random()*5)+1;
            while(groupUsed['g'+item.gIdx].includes(sDay)) sDay = (sDay%5)+1;
            groupUsed['g'+item.gIdx].push(sDay);

            let days = ["","","","","","",""];
            const total = new Date(currentDate.getFullYear(), currentDate.getMonth()+1, 0).getDate();
            for(let d=sDay, c=0; d<=total && c<7; d+=5, c++) days[c] = d.toString().padStart(2, '0');
            
            results[item.name] = days;

            // រង់ចាំឱ្យអ្នកមើលទាន់
            await new Promise(r => setTimeout(r, 600));
            row.classList.remove('active-row');
        }

        // ៣. បញ្ចប់
        pointer.style.display = 'none';
        db.ref(getMonthKey()).set(results);
        document.getElementById('displayBox').innerText = "រួចរាល់ ✨";
        document.getElementById('startBtn').disabled = false;
        isSpinning = false;
    }

    // មុខងាររំកិលព្រួញទៅរកជួរដេក
    function movePointerToRow(gIdx, nIdx) {
        const row = document.getElementById(`row-${gIdx}-${nIdx}`);
        const pointer = document.getElementById('pointer');
        if(row && pointer) {
            const rowOffset = row.offsetTop;
            const rowHeight = row.offsetHeight;
            const pointerHeight = 30; // border-top + border-bottom
            // ដាក់ព្រួញឱ្យនៅចំកណ្តាលជួរដេក
            pointer.style.top = (rowOffset + (rowHeight / 2) - (pointerHeight / 2)) + 'px';
        }
    }

    function changeMonth(s) { currentDate.setMonth(currentDate.getMonth()+s); loadData(); }
    function resetData() { if(confirm("Reset data?")) db.ref(getMonthKey()).remove(); }
    
    function exportToExcel() { XLSX.writeFile(XLSX.utils.table_to_book(document.getElementById("dutyTable")), "Duty.xlsx"); }

    // --- មុខងារថតរូបដែលមានគែមធំស្អាត ---
    function exportToImage() {
        const area = document.getElementById("captureArea");
        
        // ១. បន្ថែម class ដើម្បីបង្កើន padding ពេលថតរូប
        area.classList.add('capture-padding');
        
        // ២. ចាប់ផ្ដើមថត
        html2canvas(area, {
            scale: 2, // កម្រិតច្បាស់
            backgroundColor: "#ffffff",
            logging: false,
            useCORS: true
        }).then(canvas => {
            // ៣. លុប class វិញក្រោយពេលថតរួច ដើម្បីឱ្យវិបសាយបង្ហាញដូចដើម
            area.classList.remove('capture-padding');
            
            const link = document.createElement('a');
            link.download = `Duty_${document.getElementById('monthTitle').innerText}.png`;
            link.href = canvas.toDataURL();
            link.click();
        });
    }
</script>
</body>
</html>
