<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>ប្រព័ន្ធប្រតិទិនយាម - Perfect Mobile View</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root { --primary: #004d40; --accent: #ff6f00; --bg: #eceff1; }
        body { font-family: 'Kantumruy Pro', sans-serif; background: var(--bg); margin: 0; padding: 5px; box-sizing: border-box; }
        
        .container { background: white; width: 100%; max-width: 1000px; margin: auto; padding: 10px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none; box-sizing: border-box; }
        
        /* Header ឱ្យសមនឹងអេក្រង់តូច */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; background: var(--primary); color: white; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
        .calendar-header h2 { font-size: 1.1rem; margin: 0; text-align: center; }

        /* Admin Box */
        .manage-box { background: #f1f8e9; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #c8e6c9; text-align: center; }
        #displayBox { font-size: 1.8rem; font-weight: 800; color: var(--primary); min-height: 50px; margin: 5px 0; background: #fff; padding: 5px; border-radius: 6px; border: 2px dashed var(--primary); display: flex; align-items: center; justify-content: center; }

        /* --- បច្ចេកទេសធ្វើឱ្យតារាងសមនឹងអេក្រង់ទូរស័ព្ទ --- */
        .table-responsive { 
            width: 100%; 
            overflow-x: hidden; /* បិទការអូសទៅឆ្វេងស្ដាំ បើមិនចាំបាច់ */
            border: 1.2px solid #000; 
            background: #fff;
            box-sizing: border-box;
        }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            table-layout: fixed; /* បង្ខំឱ្យក្រឡារត់ស្មើគ្នាក្នុងអេក្រង់ */
        }

        th, td { 
            border: 1px solid #000; 
            padding: 8px 2px; 
            text-align: center; 
            font-size: 0.75rem; /* អក្សរតូចល្មមសម្រាប់ទូរស័ព្ទ */
            font-weight: 700;
            word-wrap: break-word;
        }

        /* លៃទំហំក្រឡានីមួយៗ */
        th:nth-child(1), td:nth-child(1) { width: 10%; } /* ល.រ */
        th:nth-child(2), td:nth-child(2) { width: 30%; text-align: left; padding-left: 5px; } /* ឈ្មោះ */
        /* ថ្ងៃយាម ៧ ក្រឡាទៀត លៃឱ្យស្មើគ្នា */

        th { background: #37474f; color: white; font-size: 0.7rem; }
        .group-header { background: #cfd8dc !important; text-align: left !important; padding-left: 8px; font-weight: 800; font-size: 0.8rem; }
        .filled { background: #fff9c4 !important; color: #b71c1c; font-size: 0.9rem; }

        /* ប៊ូតុងរៀបជួរគ្នាស្អាត */
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; justify-content: center; }
        .btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: 700; font-family: inherit; font-size: 13px; text-transform: uppercase; width: 48%; }
        .btn-img { background: #f39c12; color: white; }
        .btn-logout { background: #555; color: white; }
        .btn-start { background: var(--primary); color: white; width: 100%; margin-top: 8px; }

        /* សម្រាប់កុំព្យូទ័រ ឱ្យអក្សរធំវិញ */
        @media (min-width: 768px) {
            th, td { font-size: 1rem; padding: 12px; }
            .btn { width: auto; }
            .calendar-header h2 { font-size: 1.5rem; }
        }

        #loginOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--primary); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { background: white; padding: 25px; border-radius: 10px; width: 85%; max-width: 320px; text-align: center; }
        .login-box input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        
        /* សម្រាប់ថតរូបឱ្យមានគែមស្អាត */
        .capture-padding { padding: 30px !important; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2 style="color:var(--primary)">ប្រព័ន្ធយាម</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button class="btn btn-start" onclick="checkLogin()">LOGIN</button>
    </div>
</div>

<div class="container" id="mainApp">
    <div class="calendar-header">
        <button onclick="changeMonth(-1)" style="background:none; border:1px solid white; color:white; padding:4px 8px; border-radius:4px;">◀</button>
        <h2 id="monthTitle">---</h2>
        <button onclick="changeMonth(1)" style="background:none; border:1px solid white; color:white; padding:4px 8px; border-radius:4px;">▶</button>
    </div>

    <div id="adminPanel" class="manage-box" style="display:none;">
        <div id="displayBox">READY</div>
        <button id="startBtn" class="btn btn-start" onclick="startExcitingAuto()">🎲 ចាប់ផ្ដើមរៀបចំ (START)</button>
        <button class="btn" style="background:#78909c; color:white; width:100%; margin-top:5px;" onclick="resetData()">♻️ Reset Data</button>
    </div>

    <div class="btn-group">
        <button class="btn btn-img" onclick="exportToImage()">🖼️ IMAGE</button>
        <button class="btn btn-logout" onclick="logout()">🚪 LOGOUT</button>
        <button class="btn" style="background:#444; color:white;" onclick="location.reload()">🔄 REFRESH</button>
    </div>

    <div class="table-responsive" id="captureArea">
        <table id="dutyTable">
            <thead>
                <tr>
                    <th>ល.រ</th>
                    <th>ឈ្មោះ</th>
                    <th colspan="7">ថ្ងៃយាម</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDYEk9HCOL8ClUffxKsA1M2WEKCBSc4zlU",
        databaseURL: "https://my-duty-system-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "my-duty-system",
        appId: "1:430122553040:web:897c088b3d6a0b46f458d5"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const members = ["សោម-ទិ", "អ៊ុយ-សុផល", "ស្វាយ-ប៊ុននី", "ទិត-សិទ្ធា", "សៀង-ប៉ាច", "ជូ-ច័ន្ទថុល", "វិះ-អរុណ", "គឹម-សែនសេរី", "ឃឹម-លុច", "អ៊ុន-ដារ៉េត", "សួន-ពៅ", "ហែម-ហាន", "នឿន-វណ្ណេត", "អ៊ុំ-វិច្ឆិ", "អ៊ុន-មករា"];
    let currentDate = new Date();

    window.onload = () => {
        const role = sessionStorage.getItem('userRole');
        if (role) showApp(role);
    };

    function checkLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        let role = (u === 'admin' && p === '123') ? 'ADMIN' : (u === 'user' && p === '123' ? 'USER' : null);
        if (role) { sessionStorage.setItem('userRole', role); showApp(role); }
        else { alert("Login Error!"); }
    }

    function showApp(role) {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        if (role === 'ADMIN') document.getElementById('adminPanel').style.display = 'block';
        loadData();
    }

    function logout() { sessionStorage.clear(); location.reload(); }

    function getMonthKey() { return "duty_" + currentDate.getFullYear() + "_" + currentDate.getMonth(); }

    function loadData() {
        const months = ["មករា", "កុម្ភៈ", "មីនា", "មេសា", "ឧសភា", "មិថុនា", "កក្កដា", "សីហា", "កញ្ញា", "តុលា", "វិច្ឆិកា", "ធ្នូ"];
        document.getElementById('monthTitle').innerText = months[currentDate.getMonth()] + " " + currentDate.getFullYear();
        db.ref(getMonthKey()).on('value', snap => renderTable(snap.val() || {}));
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        for(let gi=0; gi<3; gi++) {
            tbody.innerHTML += `<tr><td colspan="9" class="group-header">ក្រុមទី ${gi+1}</td></tr>`;
            for(let ni=0; ni<5; ni++) {
                const name = members[gi*5 + ni];
                const days = data[name] || ["","","","","","",""];
                tbody.innerHTML += `<tr><td>${ni+1}</td><td style="text-align:left;">${name}</td>${days.map(d=>`<td class="${d?'filled':''}">${d}</td>`).join('')}</tr>`;
            }
        }
    }

    async function startExcitingAuto() {
        const startBtn = document.getElementById('startBtn');
        startBtn.disabled = true;
        let flatList = [...members].sort(() => Math.random() - 0.5);
        let results = {};
        let groupUsed = {g0:[], g1:[], g2:[]};

        for(let name of flatList) {
            const gi = Math.floor(members.indexOf(name) / 5);
            let timer = 0;
            while(timer < 300) {
                document.getElementById('displayBox').innerText = members[Math.floor(Math.random()*members.length)];
                await new Promise(r => setTimeout(r, 50));
                timer += 50;
            }
            document.getElementById('displayBox').innerText = name;
            
            let sDay = Math.floor(Math.random()*5)+1;
            while(groupUsed['g'+gi].includes(sDay)) sDay = (sDay%5)+1;
            groupUsed['g'+gi].push(sDay);

            let days = ["","","","","","",""];
            const total = new Date(currentDate.getFullYear(), currentDate.getMonth()+1, 0).getDate();
            for(let d=sDay, c=0; d<=total && c<7; d+=5, c++) days[c] = d.toString().padStart(2, '0');
            
            db.ref(getMonthKey()).update({[name]: days});
            await new Promise(r => setTimeout(r, 400));
        }
        document.getElementById('displayBox').innerText = "រួចរាល់ ✨";
        startBtn.disabled = false;
    }

    function changeMonth(s) { currentDate.setMonth(currentDate.getMonth()+s); loadData(); }
    function resetData() { if(confirm("Reset?")) db.ref(getMonthKey()).remove(); }
    
    function exportToImage() {
        const area = document.getElementById("captureArea");
        area.classList.add('capture-padding');
        html2canvas(area, { scale: 3, backgroundColor: "#ffffff" }).then(canvas => {
            area.classList.remove('capture-padding');
            const link = document.createElement('a');
            link.download = `Duty_${document.getElementById('monthTitle').innerText}.png`;
            link.href = canvas.toDataURL();
            link.click();
        });
    }
</script>
</body>
</html>
