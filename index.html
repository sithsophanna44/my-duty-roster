<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធប្រតិទិនយាម - ជំនាន់អក្សរធំច្បាស់</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #004d40; /* បៃតងចាស់ ផ្លូវការ */
            --accent: #ff6f00; /* ទឹកក្រូចសម្រាប់ហាយឡាយ */
            --bg-body: #eceff1;
            --bg-container: #ffffff;
            --text-main: #212121;
            --border-color: #000000;
        }

        body { 
            font-family: 'Kantumruy Pro', sans-serif; 
            background: var(--bg-body); 
            color: var(--text-main); 
            margin: 0; 
            padding: 20px; 
            font-size: 18px; /* ពង្រីកអក្សរទូទៅ */
        }

        .container { 
            background: var(--bg-container); 
            max-width: 1200px; 
            margin: auto; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            border: 1px solid #cfd8dc;
        }

        /* Header */
        .calendar-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: var(--primary); 
            color: white; 
            padding: 20px; 
            border-radius: 6px; 
            margin-bottom: 25px;
        }
        .calendar-header h2 { margin: 0; font-size: 26px; letter-spacing: 1px; }

        /* Control Box */
        .spin-box { 
            text-align: center; 
            border: 2px solid var(--primary); 
            padding: 30px; 
            border-radius: 10px; 
            background: #f1f8e9; 
            margin-bottom: 30px;
        }
        #displayBox { 
            font-size: 50px; /* អក្សរវិលធំខ្លាំង */
            font-weight: 700; 
            color: var(--primary); 
            min-height: 70px; 
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        #statusMsg { font-size: 18px; color: #555; font-weight: 600; margin-bottom: 20px; }

        /* Table Style - ច្បាស់ៗ */
        .duty-table { 
            width: 100%; 
            border-collapse: collapse; 
            background: white; 
            border: 2px solid var(--border-color); 
        }
        .duty-table th, .duty-table td { 
            border: 1.5px solid var(--border-color); 
            padding: 15px; 
            text-align: center; 
            font-size: 18px; /* ពង្រីកអក្សរក្នុងតារាង */
            font-weight: 600;
        }
        .duty-table th { 
            background: #37474f; 
            color: white; 
            font-size: 19px;
            text-transform: uppercase;
        }
        .group-header { 
            background: #cfd8dc !important; 
            color: #000 !important; 
            text-align: left !important; 
            padding-left: 20px; 
            font-size: 20px; 
            font-weight: 700;
        }
        .name-cell { 
            text-align: left !important; 
            padding-left: 20px; 
            font-size: 20px; 
            color: #004d40;
        }
        .filled { 
            background: #fff9c4 !important; /* ពណ៌លឿងខ្ចីងាយមើល */
            color: #b71c1c; 
            font-size: 22px; /* លេខថ្ងៃធំច្បាស់ */
            font-weight: 700;
        }

        /* Buttons */
        .btn-group { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .btn { 
            padding: 15px 35px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 18px; 
            font-weight: 700; 
            transition: 0.2s;
        }
        .btn-start { background: var(--primary); color: white; }
        .btn-start:hover { background: #00695c; }
        .btn-excel { background: #2e7d32; color: white; }
        .btn-reset { background: #78909c; color: white; }
        .btn-nav { background: rgba(255,255,255,0.2); color: white; border: 1px solid white; padding: 10px; cursor: pointer; border-radius: 4px; font-weight: bold; }

        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; border: none; width: 100%; max-width: 100%; padding: 0; }
            .spin-box, .btn-group, .calendar-header button { display: none; }
            .duty-table th { background: #eee !important; color: black; }
            .duty-table { font-size: 16px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="calendar-header">
        <button class="btn-nav" onclick="changeMonth(-1)">◀ ខែមុន</button>
        <h2 id="monthTitle">---</h2>
        <button class="btn-nav" onclick="changeMonth(1)">ខែបន្ទាប់ ▶</button>
    </div>

    <div class="spin-box">
        <div id="displayBox">DEPLOYMENT</div>
        <div id="statusMsg">ត្រៀមខ្លួន...</div>
        <div class="btn-group">
            <button id="startBtn" class="btn btn-start" onclick="startFreshRandom()">🎲 ចាប់ផ្ដើមរៀបចំអូតូ</button>
            <button class="btn btn-excel" onclick="exportToExcel()">📊 ទាញយកជា EXCEL</button>
            <button class="btn btn-reset" onclick="resetAll()">♻️ សម្អាតចោល</button>
        </div>
    </div>

    <table class="duty-table" id="dutyTable">
        <thead>
            <tr>
                <th width="8%">ល.រ</th>
                <th width="32%">នាម និង គោត្តនាម</th>
                <th colspan="7">កាលបរិច្ឆេទយាម (រំលង ៤ ថ្ងៃ)</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    const members = ["សោម-ទិ", "អ៊ុយ-សុផល", "ស្វាយ-ប៊ុននី", "ទិត-សិទ្ធា", "សៀង-ប៉ាច", "ជូ-ច័ន្ទថុល", "វិះ-អរុណ", "គឹម-សែនសេរី", "ឃឹម-លុច", "អ៊ុន-ដារ៉េត", "សួន-ពៅ", "ហែម-ហាន", "នឿន-វណ្ណេត", "អ៊ុំ-វិច្ឆិ", "អ៊ុន-មករា"];
    let currentDate = new Date();
    let spinList = [];
    let groupUsedOffsets = { g1: [], g2: [], g3: [] };

    function getMonthKey(date) { return "duty_" + date.getFullYear() + "_" + date.getMonth(); }

    function init() {
        const months = ["មករា", "កុម្ភៈ", "មីនា", "មេសា", "ឧសភា", "មិថុនា", "កក្កដា", "សីហា", "កញ្ញា", "តុលា", "វិច្ឆិកា", "ធ្នូ"];
        document.getElementById('monthTitle').innerText = "ខែ" + months[currentDate.getMonth()] + " ឆ្នាំ " + currentDate.getFullYear();
        
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        const savedData = JSON.parse(localStorage.getItem(getMonthKey(currentDate))) || {};
        const groups = ["ក្រុមទី ១ (ប្រចាំបញ្ជា)", "ក្រុមទី ២ (ប្រចាំការ)", "ក្រុមទី ៣ (ប្រចាំថ្ងៃ)"];
        
        groups.forEach((g, idx) => {
            tbody.innerHTML += `<tr><td colspan="9" class="group-header">${g}</td></tr>`;
            for (let i = 0; i < 5; i++) {
                const name = members[idx * 5 + i];
                const days = savedData[name] || ["", "", "", "", "", "", ""];
                tbody.innerHTML += `
                    <tr id="row-${name}">
                        <td>${(i+1).toString().padStart(2, '0')}</td>
                        <td class="name-cell">${name}</td>
                        ${days.map(d => `<td class="${d ? 'filled' : ''}">${d}</td>`).join('')}
                    </tr>`;
            }
        });

        document.getElementById('startBtn').disabled = Object.keys(savedData).length > 0;
        document.getElementById('statusMsg').innerText = Object.keys(savedData).length > 0 ? "ស្ថានភាព៖ រៀបចំរួចរាល់" : "ស្ថានភាព៖ រង់ចាំការរៀបចំ";
    }

    async function startFreshRandom() {
        document.getElementById('startBtn').disabled = true;
        groupUsedOffsets = { g1: [], g2: [], g3: [] };
        spinList = [...members].sort(() => Math.random() - 0.5);
        let monthData = {};

        for (let i = 0; i < members.length; i++) {
            const finalName = await runOnePerson();
            monthData[finalName] = fillData(finalName);
        }

        localStorage.setItem(getMonthKey(currentDate), JSON.stringify(monthData));
        document.getElementById('displayBox').innerText = "រួចរាល់!";
        document.getElementById('statusMsg').innerText = "ស្ថានភាព៖ បានរក្សាទុកទិន្នន័យ";
    }

    function runOnePerson() {
        return new Promise((resolve) => {
            let timer = 0;
            const spinInterval = setInterval(() => {
                const tempPick = spinList[Math.floor(Math.random() * spinList.length)];
                document.getElementById('displayBox').innerText = tempPick;
                timer += 50;
                if (timer > 400) {
                    clearInterval(spinInterval);
                    const finalName = document.getElementById('displayBox').innerText;
                    spinList = spinList.filter(n => n !== finalName);
                    setTimeout(() => resolve(finalName), 50);
                }
            }, 50);
        });
    }

    function fillData(name) {
        const nameIdx = members.indexOf(name);
        const gKey = nameIdx < 5 ? 'g1' : (nameIdx < 10 ? 'g2' : 'g3');

        let startDay = Math.floor(Math.random() * 5) + 1;
        while (groupUsedOffsets[gKey].includes(startDay)) { startDay = (startDay % 5) + 1; }
        groupUsedOffsets[gKey].push(startDay);

        const totalDays = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
        const row = document.getElementById(`row-${name}`);
        let daysArray = ["", "", "", "", "", "", ""];
        let cellIdx = 0;
        for (let d = startDay; d <= totalDays; d += 5) {
            if (cellIdx < 7) {
                row.cells[cellIdx + 2].innerText = d.toString().padStart(2, '0');
                row.cells[cellIdx + 2].classList.add('filled');
                daysArray[cellIdx] = d.toString().padStart(2, '0');
                cellIdx++;
            }
        }
        return daysArray;
    }

    function changeMonth(step) { currentDate.setMonth(currentDate.getMonth() + step); init(); }
    function resetAll() { if(confirm("តើអ្នកចង់សម្អាតទិន្នន័យខែនេះមែនទេ?")) { localStorage.removeItem(getMonthKey(currentDate)); init(); } }
    function exportToExcel() { XLSX.writeFile(XLSX.utils.table_to_book(document.getElementById("dutyTable")), `Schedule_${document.getElementById('monthTitle').innerText}.xlsx`); }
    window.onload = init;
</script>
</body>
</html>
