<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគ្រប់គ្រងការប្រចាំការ - Mobile Ready</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #004d40;
            --accent: #ff6f00;
            --bg-body: #eceff1;
            --bg-container: #ffffff;
            --text-main: #212121;
        }

        body { font-family: 'Kantumruy Pro', sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; padding: 10px; font-size: 16px; }
        .container { background: var(--bg-container); max-width: 1200px; margin: auto; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* Header Responsive */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; background: var(--primary); color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .calendar-header h2 { margin: 0; font-size: 1.2rem; flex: 1; text-align: center; }

        /* Manage Section */
        .manage-panel { background: #f1f8e9; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #c8e6c9; }
        .input-group { display: flex; gap: 8px; margin-bottom: 10px; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; font-family: inherit; }
        .member-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .member-tag { background: white; padding: 4px 10px; border-radius: 20px; border: 1px solid #ddd; display: flex; align-items: center; gap: 5px; font-size: 14px; }
        .btn-del { color: red; cursor: pointer; font-weight: bold; border: none; background: none; }
        .btn-edit { color: blue; cursor: pointer; font-size: 12px; border: none; background: none; }

        /* Spin Box */
        .spin-box { text-align: center; border: 2px solid var(--primary); padding: 20px; border-radius: 10px; background: #fff; margin-bottom: 20px; }
        #displayBox { font-size: 2.5rem; font-weight: 700; color: var(--primary); min-height: 60px; margin-bottom: 10px; word-break: break-all; }
        
        /* Table Responsive */
        .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .duty-table { width: 100%; border-collapse: collapse; background: white; min-width: 800px; border: 1.5px solid #000; }
        .duty-table th, .duty-table td { border: 1px solid #000; padding: 10px; text-align: center; font-weight: 600; }
        .duty-table th { background: #37474f; color: white; font-size: 14px; }
        .group-header { background: #cfd8dc !important; text-align: left !important; padding-left: 15px; font-weight: 700; }
        .name-cell { text-align: left !important; padding-left: 15px; color: var(--primary); min-width: 150px; }
        .filled { background: #fff9c4 !important; color: #b71c1c; font-weight: 700; font-size: 1.1rem; }
        .active-row { background: #e0f2f1 !important; }

        /* Buttons */
        .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: 700; transition: 0.2s; font-family: inherit; }
        .btn-start { background: var(--primary); color: white; }
        .btn-excel { background: #2e7d32; color: white; }
        .btn-reset { background: #78909c; color: white; }
        .btn-add { background: var(--accent); color: white; }
        .btn-nav { background: rgba(255,255,255,0.2); color: white; border: 1px solid white; padding: 5px 10px; border-radius: 4px; cursor: pointer; }

        @media (max-width: 600px) {
            body { padding: 5px; }
            .calendar-header h2 { font-size: 1rem; }
            #displayBox { font-size: 1.8rem; }
            .btn { width: 100%; padding: 12px; }
            .input-group { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="calendar-header">
        <button class="btn-nav" onclick="changeMonth(-1)">◀</button>
        <h2 id="monthTitle">---</h2>
        <button class="btn-nav" onclick="changeMonth(1)">▶</button>
    </div>

    <div class="manage-panel">
        <div class="input-group">
            <input type="text" id="nameInput" placeholder="បញ្ចូលឈ្មោះសមាជិកថ្មី...">
            <select id="groupSelect" style="padding: 8px; border-radius: 4px;">
                <option value="0">ប្រចាំបញ្ជា</option>
                <option value="1">ប្រចាំការ</option>
                <option value="2">ប្រចាំថ្ងៃ</option>
            </select>
            <button class="btn btn-add" onclick="addMember()">+ បន្ថែម</button>
        </div>
        <div id="memberTags" class="member-list"></div>
    </div>

    <div class="spin-box">
        <div id="displayBox">READY</div>
        <div id="statusMsg" style="font-size: 14px; margin-bottom: 15px;">ត្រៀមរៀបចំកាលវិភាគ</div>
        <div class="btn-group">
            <button id="startBtn" class="btn btn-start" onclick="startStepByStep()">🚀 រៀបចំអូតូ (ម្ដងម្នាក់)</button>
            <button class="btn btn-excel" onclick="exportToExcel()">📊 Download Excel</button>
            <button class="btn btn-reset" onclick="resetAll()">♻️ Reset</button>
        </div>
    </div>

    <div class="table-responsive">
        <table class="duty-table" id="dutyTable">
            <thead>
                <tr>
                    <th width="50">ល.រ</th>
                    <th>នាម និង គោត្តនាម</th>
                    <th colspan="7">កាលបរិច្ឆេទយាម (រំលង ៤ ថ្ងៃ)</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // ទាញយកបញ្ជីឈ្មោះពី LocalStorage ឬប្រើឈ្មោះដើម
    let membersGroups = JSON.parse(localStorage.getItem('member_list')) || [
        ["សោម-ទិ", "អ៊ុយ-សុផល", "ស្វាយ-ប៊ុននី", "ទិត-សិទ្ធា", "សៀង-ប៉ាច"],
        ["ជូ-ច័ន្ទថុល", "វិះ-អរុណ", "គឹម-សែនសេរី", "ឃឹម-លុច", "អ៊ុន-ដារ៉េត"],
        ["សួន-ពៅ", "ហែម-ហាន", "នឿន-វណ្ណេត", "អ៊ុំ-វិច្ឆិ", "អ៊ុន-មករា"]
    ];

    let currentDate = new Date();
    let groupUsedOffsets = { g0: [], g1: [], g2: [] };

    function getMonthKey(date) { return "duty_" + date.getFullYear() + "_" + date.getMonth(); }

    function init() {
        const months = ["មករា", "កុម្ភៈ", "មីនា", "មេសា", "ឧសភា", "មិថុនា", "កក្កដា", "សីហា", "កញ្ញា", "តុលា", "វិច្ឆិកា", "ធ្នូ"];
        document.getElementById('monthTitle').innerText = "ខែ" + months[currentDate.getMonth()] + " ឆ្នាំ " + currentDate.getFullYear();
        
        renderMembers();
        renderTable();
    }

    // បង្ហាញ Tag ឈ្មោះសមាជិកសម្រាប់ Edit/Delete
    function renderMembers() {
        const tagBox = document.getElementById('memberTags');
        tagBox.innerHTML = '';
        membersGroups.forEach((group, gIdx) => {
            group.forEach((name, nIdx) => {
                const tag = document.createElement('div');
                tag.className = 'member-tag';
                tag.innerHTML = `${name} <button class="btn-edit" onclick="editMember(${gIdx},${nIdx})">✎</button> <button class="btn-del" onclick="deleteMember(${gIdx},${nIdx})">×</button>`;
                tagBox.appendChild(tag);
            });
        });
        localStorage.setItem('member_list', JSON.stringify(membersGroups));
    }

    function addMember() {
        const name = document.getElementById('nameInput').value.trim();
        const gIdx = document.getElementById('groupSelect').value;
        if (name) {
            membersGroups[gIdx].push(name);
            document.getElementById('nameInput').value = '';
            init();
        }
    }

    function editMember(gIdx, nIdx) {
        const newName = prompt("កែប្រែឈ្មោះសមាជិក៖", membersGroups[gIdx][nIdx]);
        if (newName) {
            membersGroups[gIdx][nIdx] = newName.trim();
            init();
        }
    }

    function deleteMember(gIdx, nIdx) {
        if (confirm("តើអ្នកចង់លុបឈ្មោះនេះមែនទេ?")) {
            membersGroups[gIdx].splice(nIdx, 1);
            init();
        }
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        const savedData = JSON.parse(localStorage.getItem(getMonthKey(currentDate))) || {};
        const groupTitles = ["ប្រចាំបញ្ជា", "ប្រចាំការ", "ប្រចាំថ្ងៃ"];
        
        membersGroups.forEach((group, gIdx) => {
            tbody.innerHTML += `<tr><td colspan="9" class="group-header">${groupTitles[gIdx]}</td></tr>`;
            group.forEach((name, nIdx) => {
                const days = savedData[name] || ["", "", "", "", "", "", ""];
                tbody.innerHTML += `
                    <tr id="row-${name.replace(/\s+/g, '-')}">
                        <td>${(nIdx+1).toString().padStart(2, '0')}</td>
                        <td class="name-cell">${name}</td>
                        ${days.map(d => `<td class="${d ? 'filled' : ''}">${d}</td>`).join('')}
                    </tr>`;
            });
        });
        document.getElementById('startBtn').disabled = Object.keys(savedData).length > 0;
    }

    async function startStepByStep() {
        document.getElementById('startBtn').disabled = true;
        groupUsedOffsets = { g0: [], g1: [], g2: [] };
        let allMembers = [];
        membersGroups.forEach((group, gIdx) => {
            group.forEach(name => allMembers.push({name, gIdx}));
        });
        
        let spinList = [...allMembers].sort(() => Math.random() - 0.5);
        let monthData = {};

        for (let i = 0; i < allMembers.length; i++) {
            const memberObj = await new Promise(res => {
                let time = 0;
                let itv = setInterval(() => {
                    document.getElementById('displayBox').innerText = spinList[Math.floor(Math.random() * spinList.length)].name;
                    if ((time += 50) > 600) {
                        clearInterval(itv);
                        let pick = spinList[Math.floor(Math.random() * spinList.length)];
                        res(pick);
                    }
                }, 50);
            });

            monthData[memberObj.name] = fillData(memberObj.name, memberObj.gIdx);
            spinList = spinList.filter(m => m.name !== memberObj.name);
            await new Promise(res => setTimeout(res, 800));
        }

        localStorage.setItem(getMonthKey(currentDate), JSON.stringify(monthData));
        document.getElementById('displayBox').innerText = "DONE!";
        init();
    }

    function fillData(name, gIdx) {
        const gKey = 'g' + gIdx;
        let startDay = Math.floor(Math.random() * 5) + 1;
        while (groupUsedOffsets[gKey].includes(startDay)) startDay = (startDay % 5) + 1;
        groupUsedOffsets[gKey].push(startDay);

        const total = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
        const rowId = `row-${name.replace(/\s+/g, '-')}`;
        const row = document.getElementById(rowId);
        if(row) row.classList.add('active-row');

        let days = ["", "", "", "", "", "", ""];
        for (let d = startDay, c = 0; d <= total && c < 7; d += 5, c++) {
            days[c] = d.toString().padStart(2, '0');
            if(row) {
                row.cells[c + 2].innerText = days[c];
                row.cells[c + 2].classList.add('filled');
            }
        }
        setTimeout(() => { if(row) row.classList.remove('active-row'); }, 600);
        return days;
    }

    function changeMonth(s) { currentDate.setMonth(currentDate.getMonth() + s); init(); }
    function resetAll() { if(confirm("Reset data for this month?")) { localStorage.removeItem(getMonthKey(currentDate)); init(); } }
    
    function exportToExcel() {
        const wb = XLSX.utils.table_to_book(document.getElementById("dutyTable"), { sheet: "Duty" });
        XLSX.writeFile(wb, `Duty_${document.getElementById('monthTitle').innerText}.xlsx`);
    }

    window.onload = init;
</script>
</body>
</html>
