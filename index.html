<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធប្រតិទិនយាម - រត់ម្ដងម្នាក់</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #004d40;
            --accent: #ff6f00;
            --bg-body: #eceff1;
            --bg-container: #ffffff;
            --text-main: #212121;
            --border-color: #000000;
        }

        body { font-family: 'Kantumruy Pro', sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; padding: 20px; font-size: 18px; }
        .container { background: var(--bg-container); max-width: 1200px; margin: auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid #cfd8dc; }
        
        .calendar-header { display: flex; justify-content: space-between; align-items: center; background: var(--primary); color: white; padding: 20px; border-radius: 6px; margin-bottom: 25px; }
        .calendar-header h2 { margin: 0; font-size: 26px; }

        .spin-box { text-align: center; border: 2px solid var(--primary); padding: 30px; border-radius: 10px; background: #f1f8e9; margin-bottom: 30px; }
        #displayBox { font-size: 50px; font-weight: 700; color: var(--primary); min-height: 70px; margin-bottom: 10px; }
        #statusMsg { font-size: 18px; color: #555; font-weight: 600; margin-bottom: 20px; }

        .duty-table { width: 100%; border-collapse: collapse; background: white; border: 2px solid var(--border-color); }
        .duty-table th, .duty-table td { border: 1.5px solid var(--border-color); padding: 15px; text-align: center; font-size: 18px; font-weight: 600; }
        .duty-table th { background: #37474f; color: white; font-size: 19px; }
        .group-header { background: #cfd8dc !important; color: #000 !important; text-align: left !important; padding-left: 20px; font-size: 20px; font-weight: 700; }
        .name-cell { text-align: left !important; padding-left: 20px; font-size: 20px; color: #004d40; transition: background 0.5s; }
        .filled { background: #fff9c4 !important; color: #b71c1c; font-size: 22px; font-weight: 700; }
        
        /* ហាយឡាយជួរដែលកំពុងបំពេញ */
        .active-row { background: #e0f2f1 !important; border: 2px solid var(--accent) !important; }

        .btn-group { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 15px 35px; border: none; border-radius: 6px; cursor: pointer; font-size: 18px; font-weight: 700; transition: 0.2s; }
        .btn-start { background: var(--primary); color: white; }
        .btn-excel { background: #2e7d32; color: white; }
        .btn-reset { background: #78909c; color: white; }
        .btn-nav { background: rgba(255,255,255,0.2); color: white; border: 1px solid white; padding: 10px; cursor: pointer; border-radius: 4px; font-weight: bold; }

        @media print { .spin-box, .btn-group, .calendar-header button { display: none; } }
    </style>
</head>
<body>

<div class="container">
    <div class="calendar-header">
        <button class="btn-nav" onclick="changeMonth(-1)">◀ ខែមុន</button>
        <h2 id="monthTitle">---</h2>
        <button class="btn-nav" onclick="changeMonth(1)">ខែបន្ទាប់ ▶</button>
    </div>

    <div class="spin-box">
        <div id="displayBox">DEPLOYMENT</div>
        <div id="statusMsg">ត្រៀមខ្លួន...</div>
        <div class="btn-group">
            <button id="startBtn" class="btn btn-start" onclick="startStepByStep()">🎲 ចាប់ផ្ដើមរៀបចំ (ម្ដងម្នាក់)</button>
            <button class="btn btn-excel" onclick="exportToExcel()">📊 Download Excel</button>
            <button class="btn btn-reset" onclick="resetAll()">♻️ Reset Memory</button>
        </div>
    </div>

    <table class="duty-table" id="dutyTable">
        <thead>
            <tr>
                <th>ល.រ</th>
                <th>នាម និង គោត្តនាម</th>
                <th colspan="7">កាលបរិច្ឆេទយាម (រំលង ៤ ថ្ងៃ)</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    const members = ["សោម-ទិ", "អ៊ុយ-សុផល", "ស្វាយ-ប៊ុននី", "ទិត-សិទ្ធា", "សៀង-ប៉ាច", "ជូ-ច័ន្ទថុល", "វិះ-អរុណ", "គឹម-សែនសេរី", "ឃឹម-លុច", "អ៊ុន-ដារ៉េត", "សួន-ពៅ", "ហែម-ហាន", "នឿន-វណ្ណេត", "អ៊ុំ-វិច្ឆិ", "អ៊ុន-មករា"];
    let currentDate = new Date();
    let groupUsedOffsets = { g1: [], g2: [], g3: [] };

    function getMonthKey(date) { return "duty_" + date.getFullYear() + "_" + date.getMonth(); }

    function init() {
        const months = ["មករា", "កុម្ភៈ", "មីនា", "មេសា", "ឧសភា", "មិថុនា", "កក្កដា", "សីហា", "កញ្ញា", "តុលា", "វិច្ឆិកា", "ធ្នូ"];
        document.getElementById('monthTitle').innerText = "ខែ" + months[currentDate.getMonth()] + " ឆ្នាំ " + currentDate.getFullYear();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        const savedData = JSON.parse(localStorage.getItem(getMonthKey(currentDate))) || {};
        const groups = ["ក្រុមទី ១ (ប្រចាំបញ្ជា)", "ក្រុមទី ២ (ប្រចាំការ)", "ក្រុមទី ៣ (ប្រចាំថ្ងៃ)"];
        
        groups.forEach((g, idx) => {
            tbody.innerHTML += `<tr><td colspan="9" class="group-header">${g}</td></tr>`;
            for (let i = 0; i < 5; i++) {
                const name = members[idx * 5 + i];
                const days = savedData[name] || ["", "", "", "", "", "", ""];
                tbody.innerHTML += `<tr id="row-${name}"><td>${(i+1).toString().padStart(2, '0')}</td><td class="name-cell">${name}</td>${days.map(d => `<td class="${d ? 'filled' : ''}">${d}</td>`).join('')}</tr>`;
            }
        });
        document.getElementById('startBtn').disabled = Object.keys(savedData).length > 0;
    }

    // មុខងារចម្បង៖ រត់ម្ដងម្នាក់ៗ
    async function startStepByStep() {
        document.getElementById('startBtn').disabled = true;
        groupUsedOffsets = { g1: [], g2: [], g3: [] };
        let spinList = [...members].sort(() => Math.random() - 0.5);
        let monthData = {};

        for (let i = 0; i < members.length; i++) {
            document.getElementById('statusMsg').innerText = "កំពុងស្វែងរកសមាជិកទី " + (i + 1) + "...";
            
            // ១. វិលឈ្មោះ
            const selectedName = await new Promise(res => {
                let time = 0;
                let itv = setInterval(() => {
                    document.getElementById('displayBox').innerText = spinList[Math.floor(Math.random() * spinList.length)];
                    if ((time += 50) > 800) { // វិល ០.៨ វិនាទី
                        clearInterval(itv);
                        let finalName = document.getElementById('displayBox').innerText;
                        res(finalName);
                    }
                }, 50);
            });

            // ២. បំពេញទិន្នន័យចូលតារាងភ្លាមៗ (ម្ដងម្នាក់)
            monthData[selectedName] = fillData(selectedName);
            spinList = spinList.filter(n => n !== selectedName);

            // ៣. សម្រាកបន្តិចឱ្យអ្នកមើលទាន់ (១ វិនាទី) មុននឹងទៅអ្នកបន្ទាប់
            await new Promise(res => setTimeout(res, 1000));
        }

        localStorage.setItem(getMonthKey(currentDate), JSON.stringify(monthData));
        document.getElementById('displayBox').innerText = "ចប់សព្វគ្រប់! ✨";
        document.getElementById('statusMsg').innerText = "ទិន្នន័យត្រូវបានរក្សាទុកជោគជ័យ។";
    }

    function fillData(name) {
        const idx = members.indexOf(name);
        const gKey = idx < 5 ? 'g1' : (idx < 10 ? 'g2' : 'g3');
        
        let startDay = Math.floor(Math.random() * 5) + 1;
        while (groupUsedOffsets[gKey].includes(startDay)) startDay = (startDay % 5) + 1;
        groupUsedOffsets[gKey].push(startDay);

        const total = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
        const row = document.getElementById(`row-${name}`);
        
        // បន្ថែម Effect Highlight លើជួរដែលកំពុងជាប់ឈ្មោះ
        row.classList.add('active-row');
        
        let days = ["", "", "", "", "", "", ""];
        for (let d = startDay, c = 0; d <= total && c < 7; d += 5, c++) {
            days[c] = d.toString().padStart(2, '0');
            row.cells[c + 2].innerText = days[c];
            row.cells[c + 2].classList.add('filled');
        }
        
        // ដក Effect វិញក្រោយពេលបំពេញរួច
        setTimeout(() => row.classList.remove('active-row'), 800);
        
        return days;
    }

    function changeMonth(s) { currentDate.setMonth(currentDate.getMonth() + s); init(); }
    function resetAll() { if(confirm("តើអ្នកចង់ Reset ខែនេះមែនទេ?")) { localStorage.removeItem(getMonthKey(currentDate)); init(); } }

    function exportToExcel() {
        const wb = XLSX.utils.table_to_book(document.getElementById("dutyTable"), { sheet: "Sheet1" });
        const ws = wb.Sheets["Sheet1"];
        ws['!cols'] = [{ wch: 6 }, { wch: 25 }, { wch: 5 }, { wch: 5 }, { wch: 5 }, { wch: 5 }, { wch: 5 }, { wch: 5 }, { wch: 5 }];
        XLSX.writeFile(wb, `Duty_${document.getElementById('monthTitle').innerText.replace(/\s/g, '_')}.xlsx`);
    }

    window.onload = init;
</script>
</body>
</html>
