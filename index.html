<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធប្រតិទិនយាម - ជំនាន់ដោះស្រាយថ្ងៃទី ៣១</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Leelawadee UI', 'Kantumruy Pro', sans-serif; background: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; width: 100%; max-width: 1100px; padding: 25px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.15); }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #003366; color: white; padding: 15px; border-radius: 10px; }
        .calendar-header h2 { margin: 0; font-size: 22px; }
        .spin-box { text-align: center; border: 3px dashed #1a73e8; padding: 25px; border-radius: 12px; background: #fff; margin-bottom: 25px; }
        #displayBox { font-size: 45px; font-weight: bold; color: #1a73e8; min-height: 65px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        #statusMsg { font-size: 15px; color: #28a745; font-weight: bold; margin-bottom: 15px; height: 20px; }
        .duty-table { width: 100%; border-collapse: collapse; background: white; }
        .duty-table th, .duty-table td { border: 1px solid #000; padding: 10px; text-align: center; font-size: 14px; }
        .group-header { background: #003366 !important; color: white; text-align: left !important; padding-left: 20px; font-weight: bold; }
        .filled { background: #fffde7; font-weight: bold; color: #d32f2f; }
        .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; color: white; }
        .btn-start { background: #28a745; }
        .btn-excel { background: #1d6f42; }
        .btn-reset { background: #6c757d; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        @media print { .spin-box, .btn-group, .calendar-header button { display: none; } }
    </style>
</head>
<body>

<div class="container">
    <div class="calendar-header">
        <button onclick="changeMonth(-1)" style="cursor:pointer; color:white; background:none; border:1px solid white; padding:5px 10px; border-radius:5px;">◀ ខែមុន</button>
        <h2 id="monthTitle">---</h2>
        <button onclick="changeMonth(1)" style="cursor:pointer; color:white; background:none; border:1px solid white; padding:5px 10px; border-radius:5px;">ខែបន្ទាប់ ▶</button>
    </div>

    <div class="spin-box">
        <div id="displayBox">---</div>
        <div id="statusMsg"></div>
        <div class="btn-group">
            <button id="startBtn" class="btn btn-start" onclick="startFullAuto()">🚀 រៀបចំអូតូសម្រាប់ខែនេះ</button>
            <button class="btn btn-excel" onclick="exportToExcel()">📊 Download Excel</button>
            <button class="btn btn-reset" onclick="resetAll()">♻️ សម្អាតចោល</button>
        </div>
    </div>

    <table class="duty-table" id="dutyTable">
        <thead>
            <tr>
                <th>ល.រ</th>
                <th width="30%">នាម និង គោត្តនាម</th>
                <th colspan="7">កាលបរិច្ឆេទយាម (រំលង ៤ថ្ងៃ)</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    const members = ["សោម-ទិ", "អ៊ុយ-សុផល", "ស្វាយ-ប៊ុននី", "ទិត-សិទ្ធា", "សៀង-ប៉ាច", "ជូ-ច័ន្ទថុល", "វិះ-អរុណ", "គឹម-សែនសេរី", "ឃឹម-លុច", "អ៊ុន-ដារ៉េត", "សួន-ពៅ", "ហែម-ហាន", "នឿន-វណ្ណេត", "អ៊ុំ-វិច្ឆិ", "អ៊ុន-មករា"];
    let currentDate = new Date();
    let spinList = [];
    let usedOffsets = { g1: [], g2: [], g3: [] };

    function getMonthKey(date) { return "duty_" + date.getFullYear() + "_" + date.getMonth(); }

    function init() {
        const months = ["មករា", "កុម្ភៈ", "មីនា", "មេសា", "ឧសភា", "មិថុនា", "កក្កដា", "សីហា", "កញ្ញា", "តុលា", "វិច្ឆិកា", "ធ្នូ"];
        document.getElementById('monthTitle').innerText = months[currentDate.getMonth()] + " " + currentDate.getFullYear();
        
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        const savedData = JSON.parse(localStorage.getItem(getMonthKey(currentDate))) || {};
        const groups = ["ប្រចាំបញ្ជា", "ប្រចាំការ", "ប្រចាំថ្ងៃ"];
        
        groups.forEach((g, idx) => {
            tbody.innerHTML += `<tr><td colspan="9" class="group-header">${g}</td></tr>`;
            for (let i = 0; i < 5; i++) {
                const name = members[idx * 5 + i];
                const days = savedData[name] || ["", "", "", "", "", "", ""];
                tbody.innerHTML += `
                    <tr id="row-${name}">
                        <td>${(i+1).toString().padStart(2, '0')}</td>
                        <td style="text-align:left;padding-left:15px;">${name}</td>
                        ${days.map(d => `<td class="${d ? 'filled' : ''}">${d}</td>`).join('')}
                    </tr>`;
            }
        });

        document.getElementById('startBtn').disabled = Object.keys(savedData).length > 0;
        document.getElementById('statusMsg').innerText = Object.keys(savedData).length > 0 ? "ទិន្នន័យត្រូវបានរក្សាទុក" : "សូមចុចប៊ូតុងពណ៌បៃតង";
    }

    async function startFullAuto() {
        document.getElementById('startBtn').disabled = true;
        usedOffsets = { g1: [], g2: [], g3: [] };
        spinList = [...members].sort(() => Math.random() - 0.5);
        let monthData = {};

        for (let i = 0; i < members.length; i++) {
            const finalName = await runOnePerson();
            monthData[finalName] = fillData(finalName);
        }

        localStorage.setItem(getMonthKey(currentDate), JSON.stringify(monthData));
        document.getElementById('displayBox').innerText = "រួចរាល់! ✨";
        document.getElementById('statusMsg').innerText = "បានរក្សាទុកទិន្នន័យរួចរាល់។";
    }

    function runOnePerson() {
        return new Promise((resolve) => {
            let timer = 0;
            const spinInterval = setInterval(() => {
                const tempPick = spinList[Math.floor(Math.random() * spinList.length)];
                document.getElementById('displayBox').innerText = tempPick;
                timer += 50;
                if (timer > 500) {
                    clearInterval(spinInterval);
                    const finalName = document.getElementById('displayBox').innerText;
                    spinList = spinList.filter(n => n !== finalName);
                    setTimeout(() => resolve(finalName), 100);
                }
            }, 50);
        });
    }

    function fillData(name) {
        const nameIdx = members.indexOf(name);
        const gKey = nameIdx < 5 ? 'g1' : (nameIdx < 10 ? 'g2' : 'g3');

        const lastMonthDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), 0);
        const prevMonthData = JSON.parse(localStorage.getItem(getMonthKey(lastMonthDate))) || {};
        
        const prevDays = prevMonthData[name] || [];
        let lastDayVal = 0;
        if (prevDays.length > 0) {
            const validDays = prevDays.filter(d => d !== "");
            lastDayVal = parseInt(validDays[validDays.length - 1]);
        }

        const prevMonthTotalDays = lastMonthDate.getDate(); 
        let startDay = (lastDayVal + 5) - prevMonthTotalDays;
        while (startDay <= 0) startDay += 5;

        while (usedOffsets[gKey].includes(startDay)) { startDay = (startDay % 5) + 1; }
        usedOffsets[gKey].push(startDay);

        const currentMonthTotalDays = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
        const row = document.getElementById(`row-${name}`);
        let daysArray = ["", "", "", "", "", "", ""];
        let cellIdx = 0;
        for (let d = startDay; d <= currentMonthTotalDays; d += 5) {
            if (cellIdx < 7) {
                row.cells[cellIdx + 2].innerText = d.toString().padStart(2, '0');
                row.cells[cellIdx + 2].classList.add('filled');
                daysArray[cellIdx] = d.toString().padStart(2, '0');
                cellIdx++;
            }
        }
        return daysArray;
    }

    function changeMonth(step) { currentDate.setMonth(currentDate.getMonth() + step); init(); }
    function resetAll() { if(confirm("សម្អាតទិន្នន័យខែនេះចោល?")) { localStorage.removeItem(getMonthKey(currentDate)); init(); } }
    function exportToExcel() { XLSX.writeFile(XLSX.utils.table_to_book(document.getElementById("dutyTable")), `Duty_${document.getElementById('monthTitle').innerText}.xlsx`); }
    window.onload = init;
</script>
</body>
</html>
