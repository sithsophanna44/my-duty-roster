<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគ្រប់គ្រងការប្រចាំការ - Monthly Rotation</title>
    <style>
        body { font-family: 'Leelawadee UI', 'Kantumruy Pro', sans-serif; background: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; width: 100%; max-width: 950px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #003366; margin-bottom: 10px; }
        
        .control-panel { background: #e3f2fd; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #bbdefb; }
        .flex-row { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .flex-item { flex: 1; min-width: 200px; }
        label { font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px; }
        select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        textarea { height: 60px; resize: none; }

        .spin-section { text-align: center; background: white; padding: 20px; border-radius: 10px; border: 2px dashed #1a73e8; margin-bottom: 20px; }
        #displayBox { font-size: 40px; font-weight: bold; color: #1a73e8; min-height: 55px; margin-bottom: 15px; }
        
        .btn-group { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; color: white; transition: 0.3s; }
        .btn-start { background: #34a853; }
        .btn-stop { background: #ea4335; }
        .btn-print { background: #555; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }

        .duty-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .duty-table th, .duty-table td { border: 1px solid #000; padding: 10px; text-align: center; font-size: 14px; }
        .duty-table th { background: #f2f2f2; }
        .group-header { background: #e8f0fe !important; text-align: left !important; font-weight: bold; padding-left: 15px; }
        .filled { background: #fffde7; font-weight: bold; color: #d32f2f; }

        @media print {
            .control-panel, .spin-section, .btn-print { display: none; }
            body { padding: 0; }
            .container { box-shadow: none; border: none; width: 100%; padding: 0; }
            .duty-table td { padding: 8px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2 id="tableTitle">តារាងបែងចែក ប្រចាំបញ្ជា ប្រចាំការ និង ប្រចាំថ្ងៃ</h2>
    
    <div class="control-panel">
        <div class="flex-row">
            <div class="flex-item">
                <label>📅 ជ្រើសរើសខែរៀបចំ៖</label>
                <select id="monthSelect" onchange="updateTitle()">
                    <option value="1">មករា</option><option value="2">កុម្ភៈ</option>
                    <option value="3">មីនា</option><option value="4" selected>មេសា</option>
                    <option value="5">ឧសភា</option><option value="6">មិថុនា</option>
                    <option value="7">កក្កដា</option><option value="8">សីហា</option>
                    <option value="9">កញ្ញា</option><option value="10">តុលា</option>
                    <option value="11">វិច្ឆិកា</option><option value="12">ធ្នូ</option>
                </select>
            </div>
            <div class="flex-item">
                <label>✍️ បញ្ជីឈ្មោះសមាជិក (ដកឃ្លាគ្នា)៖</label>
                <textarea id="namesInput">សោម-ទិ អ៊ុយ-សុផល ស្វាយ-ប៊ុននី ទិត-សិទ្ធា សៀង-ប៉ាច ជូ-ច័ន្ទថុល វិះ-អរុណ គឹម-សែនសេរី ឃឹម-លុច អ៊ុន-ដារ៉េត សួន-ពៅ ហែម-ហាន នឿន-វណ្ណេត អ៊ុំ-វិច្ឆិ អ៊ុន-មករា</textarea>
            </div>
        </div>

        <div class="spin-section">
            <div id="displayBox">---</div>
            <div class="btn-group">
                <button id="startBtn" class="btn btn-start" onclick="initProcess()">▶ វិលឈ្មោះ</button>
                <button id="stopBtn" class="btn btn-stop" onclick="handleStop()" disabled>🛑 បញ្ឈប់</button>
                <button class="btn btn-print" onclick="window.print()">🖨 Print</button>
            </div>
        </div>
    </div>

    <table class="duty-table">
        <thead>
            <tr>
                <th>ល.រ</th>
                <th width="30%">នាម និង គោត្តនាម</th>
                <th colspan="6">កាលបរិច្ឆេទយាម (រំលង ៤ ថ្ងៃ)</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    let masterList = [];
    let spinInterval;
    let stopCount = 0;
    let groupProgress = { g1: 0, g2: 0, g3: 0 };

    function updateTitle() {
        const month = document.getElementById('monthSelect').options[document.getElementById('monthSelect').selectedIndex].text;
        document.getElementById('tableTitle').innerText = `តារាងបែងចែកអ្នកប្រចាំការ ខែ${month}`;
    }

    function initProcess() {
        const raw = document.getElementById('namesInput').value.trim().split(/\s+/).filter(n => n);
        if (raw.length < 15) return alert("សូមបញ្ចូលឈ្មោះឱ្យបាន ១៥ នាក់!");

        // Random ឈ្មោះមេ
        masterList = raw.sort(() => Math.random() - 0.5);
        
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';
        const groups = [{id:'g1', t:'ប្រចាំបញ្ជា'}, {id:'g2', t:'ប្រចាំការ'}, {id:'g3', t:'ប្រចាំថ្ងៃ'}];
        
        let nameMap = {};
        groups.forEach((g, gIdx) => {
            tableBody.innerHTML += `<tr><td colspan="8" class="group-header">${g.t}</td></tr>`;
            for (let i = 0; i < 5; i++) {
                let name = raw[gIdx * 5 + i];
                nameMap[name] = g.id;
                tableBody.innerHTML += `
                    <tr id="row-${g.id}-${name}">
                        <td>${(i+1).toString().padStart(2, '0')}</td>
                        <td class="name-col" style="text-align:left; padding-left:10px;">${name}</td>
                        <td class="d-1"></td><td class="d-2"></td><td class="d-3"></td>
                        <td class="d-4"></td><td class="d-5"></td><td class="d-6"></td>
                    </tr>`;
            }
        });

        // រៀបចំបញ្ជីវិលឈ្មោះថ្មី ដោយភ្ជាប់ Group ID
        masterList = masterList.map(n => ({ name: n, gid: nameMap[n] }));
        
        stopCount = 0;
        groupProgress = { g1: 0, g2: 0, g3: 0 };
        startSpinning();
    }

    function startSpinning() {
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        spinInterval = setInterval(() => {
            const pick = masterList[Math.floor(Math.random() * masterList.length)];
            document.getElementById('displayBox').innerText = pick.name;
        }, 50);
    }

    function handleStop() {
        clearInterval(spinInterval);
        const selectedName = document.getElementById('displayBox').innerText;
        const monthNum = parseInt(document.getElementById('monthSelect').value);
        const picked = masterList.find(m => m.name === selectedName);

        // --- Logic Rotate ខែបន្ទាប់ ---
        // ថ្ងៃចាប់ផ្ដើម = (លំដាប់ដែលចុចបាន + លេខខែ) % ៥
        let startDay = ((groupProgress[picked.gid] + monthNum) % 5) + 1;
        let days = [];
        for (let d = startDay; d <= 30; d += 5) days.push(d.toString().padStart(2, '0'));

        const row = document.getElementById(`row-${picked.gid}-${selectedName}`);
        if (row) {
            days.forEach((day, i) => {
                const cell = row.querySelector(`.d-${i+1}`);
                if (cell) { cell.innerText = day; cell.classList.add('filled'); }
            });
        }

        groupProgress[picked.gid]++;
        masterList = masterList.filter(m => m.name !== selectedName);
        stopCount++;

        if (masterList.length > 0) {
            setTimeout(startSpinning, 600);
        } else {
            document.getElementById('displayBox').innerText = "រួចរាល់! ✨";
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('startBtn').disabled = false;
        }
    }
    
    window.onload = updateTitle;
</script>

</body>
</html>
