<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duty Roster - Online Sync</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root { --primary: #2a3a25; --accent: #f1c40f; --bg-body: #34495e; }
        body { font-family: 'Kantumruy Pro', sans-serif; background: var(--bg-body); margin: 0; padding: 10px; color: #212121; }
        .container { background: white; max-width: 1100px; margin: auto; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: none; }
        
        /* Login */
        #loginOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--primary); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { background: white; padding: 30px; border-radius: 10px; width: 90%; max-width: 350px; text-align: center; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        
        /* UI Military */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; background: var(--primary); color: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .spin-box { text-align: center; border: 4px solid var(--primary); padding: 25px; border-radius: 12px; background-color: #3a5035; background-image: linear-gradient(45deg, rgba(0,0,0,0.1) 25%, transparent 25%); background-size: 40px 40px; color: #ccff00; margin-bottom: 20px; }
        #displayBox { font-size: 2.5rem; font-weight: 700; text-shadow: 0 0 10px rgba(204,255,0,0.8); }

        .table-responsive { width: 100%; overflow-x: auto; border: 2px solid #000; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; background: white; }
        th, td { border: 1.5px solid #000; padding: 10px; text-align: center; }
        th { background: #212121; color: white; }
        .group-header { background: #dcdcdc !important; text-align: left !important; font-weight: bold; }
        .filled { background: #a3c19e !important; font-weight: bold; }
        
        .btn { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; text-transform: uppercase; color: white; margin: 5px; }
        .btn-start { background: var(--accent); color: black; }
        .btn-excel { background: #2e7d32; }
        .btn-nav { background: none; border: 1px solid white; padding: 5px 10px; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2>LOGIN SYSTEM</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button class="btn" style="background:var(--primary); width:100%" onclick="checkLogin()">LOGIN</button>
        <p style="font-size:12px; color:#777; margin-top:10px;">Admin: admin/123 | User: user/123</p>
    </div>
</div>

<div class="container" id="mainApp">
    <div class="calendar-header">
        <button class="btn-nav" onclick="changeMonth(-1)">◀ PREV</button>
        <h2 id="monthTitle">---</h2>
        <button class="btn-nav" onclick="changeMonth(1)">NEXT ▶</button>
    </div>

    <div id="adminControls" style="display:none;">
        <div class="spin-box">
            <div id="displayBox">READY</div>
            <button id="startBtn" class="btn btn-start" onclick="startAuto()">🚀 START DEPLOYMENT</button>
        </div>
    </div>

    <div style="text-align:center; margin-bottom:15px;">
        <button class="btn btn-excel" onclick="exportToExcel()">📊 Download Excel</button>
        <button class="btn" style="background:#555" onclick="location.reload()">🔄 Refresh Data</button>
    </div>

    <div class="table-responsive">
        <table id="dutyTable">
            <thead>
                <tr>
                    <th>ល.រ</th>
                    <th>នាម និង គោត្តនាម</th>
                    <th colspan="7">កាលបរិច្ឆេទយាម</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // --- ចម្លង Firebase Config របស់អ្នកមកដាក់ទីនេះ ---
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT.firebaseio.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    // ---------------------------------------------

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const members = ["សោម-ទិ", "អ៊ុយ-សុផល", "ស្វាយ-ប៊ុននី", "ទិត-សិទ្ធា", "សៀង-ប៉ាច", "ជូ-ច័ន្ទថុល", "វិះ-អរុណ", "គឹម-សែនសេរី", "ឃឹម-លុច", "អ៊ុន-ដារ៉េត", "សួន-ពៅ", "ហែម-ហាន", "នឿន-វណ្ណេត", "អ៊ុំ-វិច្ឆិ", "អ៊ុន-មករា"];
    let currentDate = new Date();
    let currentUser = null;

    function checkLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        if(u === 'admin' && p === '123') currentUser = 'ADMIN';
        else if(u === 'user' && p === '123') currentUser = 'USER';
        
        if(currentUser) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            if(currentUser === 'ADMIN') document.getElementById('adminControls').style.display = 'block';
            loadData();
        } else { alert("Wrong credentials!"); }
    }

    function getMonthKey() { return "duty_" + currentDate.getFullYear() + "_" + currentDate.getMonth(); }

    function loadData() {
        const months = ["មករា", "កុម្ភៈ", "មីនា", "មេសា", "ឧសភា", "មិថុនា", "កក្កដា", "សីហា", "កញ្ញា", "តុលា", "វិច្ឆិកា", "ធ្នូ"];
        document.getElementById('monthTitle').innerText = months[currentDate.getMonth()] + " " + currentDate.getFullYear();
        
        // ទាញទិន្នន័យពី Firebase
        db.ref(getMonthKey()).on('value', (snapshot) => {
            const savedData = snapshot.val() || {};
            renderTable(savedData);
        });
    }

    function renderTable(savedData) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        const titles = ["UNIT 1 (ប្រចាំបញ្ជា)", "UNIT 2 (ប្រចាំការ)", "UNIT 3 (ប្រចាំថ្ងៃ)"];
        
        for(let gi=0; gi<3; gi++) {
            tbody.innerHTML += `<tr><td colspan="9" class="group-header">${titles[gi]}</td></tr>`;
            for(let ni=0; ni<5; ni++) {
                const name = members[gi*5 + ni];
                const days = savedData[name] || ["","","","","","",""];
                tbody.innerHTML += `<tr><td>${ni+1}</td><td style="text-align:left">${name}</td>${days.map(d=>`<td class="${d?'filled':''}">${d}</td>`).join('')}</tr>`;
            }
        }
    }

    async function startAuto() {
        if(currentUser !== 'ADMIN') return;
        let spinList = [...members].sort(() => Math.random() - 0.5);
        let monthData = {};
        let groupUsed = {g0:[], g1:[], g2:[]};

        for(let name of spinList) {
            const gi = Math.floor(members.indexOf(name) / 5);
            document.getElementById('displayBox').innerText = name;
            
            let sDay = Math.floor(Math.random()*5)+1;
            while(groupUsed['g'+gi].includes(sDay)) sDay = (sDay%5)+1;
            groupUsed['g'+gi].push(sDay);

            let days = ["","","","","","",""];
            const total = new Date(currentDate.getFullYear(), currentDate.getMonth()+1, 0).getDate();
            for(let d=sDay, c=0; d<=total && c<7; d+=5, c++) days[c] = d.toString().padStart(2, '0');
            
            monthData[name] = days;
            await new Promise(r => setTimeout(r, 400));
        }
        // បញ្ជូនទៅ Firebase
        db.ref(getMonthKey()).set(monthData);
        document.getElementById('displayBox').innerText = "COMPLETE";
    }

    function changeMonth(s) { currentDate.setMonth(currentDate.getMonth()+s); loadData(); }
    function exportToExcel() { XLSX.writeFile(XLSX.utils.table_to_book(document.getElementById("dutyTable")), "Duty.xlsx"); }
</script>
</body>
</html>
