<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ប្រព័ន្ធប្រតិទិនយាម - Military Mobile Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #2a3a25;
            --accent: #f1c40f;
            --bg-body: #34495e;
            --text-main: #212121;
        }

        body { font-family: 'Kantumruy Pro', sans-serif; background: var(--bg-body); margin: 0; padding: 10px; color: var(--text-main); }
        .container { background: white; max-width: 1100px; margin: auto; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

        /* Header */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; background: var(--primary); color: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-bottom: 4px solid #1e2a1a; }
        .calendar-header h2 { margin: 0; font-size: 1.1rem; font-weight: 700; text-transform: uppercase; }

        /* Manage Section */
        .manage-panel { background: #f1f8e9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #c8e6c9; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; width: 100%; box-sizing: border-box; font-family: inherit; }
        .member-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .member-tag { background: white; padding: 5px 12px; border-radius: 20px; border: 1px solid #ddd; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
        .btn-del { color: #d32f2f; cursor: pointer; border: none; background: none; font-weight: bold; font-size: 18px; }

        /* Camo Spin Box */
        .spin-box { 
            text-align: center; border: 4px solid var(--primary); padding: 25px; border-radius: 12px; 
            background-color: #3a5035; 
            background-image: linear-gradient(45deg, rgba(0,0,0,0.1) 25%, transparent 25%), linear-gradient(-45deg, rgba(0,0,0,0.1) 25%, transparent 25%), linear-gradient(45deg, transparent 75%, rgba(0,0,0,0.1) 75%), linear-gradient(-45deg, transparent 75%, rgba(0,0,0,0.1) 75%);
            background-size: 40px 40px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        #displayBox { font-size: 2.2rem; font-weight: 700; color: #ccff00; min-height: 60px; text-shadow: 0 0 15px rgba(204,255,0,0.8); text-transform: uppercase; display: flex; align-items: center; justify-content: center; }

        /* Table Mobile */
        .table-responsive { width: 100%; overflow-x: auto; border: 2px solid #000; border-radius: 4px; }
        .duty-table { width: 100%; border-collapse: collapse; min-width: 700px; background: white; }
        .duty-table th, .duty-table td { border: 1.5px solid #000; padding: 12px; text-align: center; font-weight: 600; font-size: 15px; }
        .duty-table th { background: #212121; color: white; text-transform: uppercase; }
        .group-header { background: #dcdcdc !important; text-align: left !important; padding-left: 15px; font-weight: 700; text-transform: uppercase; }
        .name-cell { text-align: left !important; padding-left: 15px; color: #1a1a1a; font-size: 16px; }
        .filled { background: #a3c19e !important; color: #1a1a1a; font-weight: 700; font-size: 18px; border: 2px solid #1e2a1a !important; }

        /* Buttons */
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .btn { padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 700; text-transform: uppercase; transition: 0.3s; color: white; width: 100%; }
        .btn-start { background: var(--accent); color: #000; }
        .btn-excel { background: #2e7d32; }
        .btn-reset { background: #5a6e75; }
        .btn-add { background: var(--primary); margin-top: 5px; }
        .btn-nav { width: auto; background: none; border: 1px solid white; color: white; padding: 5px 10px; border-radius: 4px; }

        @media (min-width: 768px) {
            .btn-group { flex-direction: row; }
            .input-group { flex-direction: row; }
            .calendar-header h2 { font-size: 1.5rem; }
            #displayBox { font-size: 3.5rem; }
        }

        @media print { .manage-panel, .spin-box, .btn-group, .calendar-header button { display: none; } body { background: white; padding: 0; } }
    </style>
</head>
<body>

<div class="container">
