<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>ប្រព័ន្ធប្រតិទិនយាម - ជំនាន់មាំមួនបំផុត</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root { --primary: #004d40; --accent: #ff6f00; --bg: #eceff1; }
        body { font-family: 'Kantumruy Pro', sans-serif; background: var(--bg); margin: 0; padding: 5px; box-sizing: border-box; }
        
        .container { background: white; width: 100%; max-width: 1000px; margin: auto; padding: 10px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none; box-sizing: border-box; }
        
        .calendar-header { display: flex; justify-content: space-between; align-items: center; background: var(--primary); color: white; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
        .calendar-header h2 { font-size: 1.2rem; margin: 0; font-weight: 700; }

        /* Admin Section */
        .manage-box { background: #f1f8e9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1.5px solid #c8e6c9; text-align: center; }
        .input-group { display: flex; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; }
        input, select { padding: 12px; border: 1px solid #ccc; border-radius: 6px; flex: 1; font-family: inherit; font-size: 16px; min-width: 140px; }
        
        .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 5px; justify-content: center; }
        .tag { background: white; padding: 6px 12px; border-radius: 20px; border: 1px solid #ddd; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }

        #displayBox { font-size: 2.2rem; font-weight: 800; color: var(--primary); min-height: 60px; margin-bottom: 10px; background: #fff; border: 2.5px dashed var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }

        /* --- ការកំណត់តារាងឱ្យស្មើអេក្រង់ទូរស័ព្ទ ១០០% --- */
        .table-responsive { 
            width: 100%; 
            overflow: hidden; 
            border: 1.5px solid #000; 
            background: #fff;
            box-sizing: border-box;
        }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            table-layout: fixed; 
        }

        th, td { 
            border: 1px solid #000; 
            padding: 8px 2px; 
            text-align: center; 
            font-size: 1.2rem; 
            font-weight: 400; 
            transition: background-color 0.15s ease;
        }

        th:nth-child(1), td:nth-child(1) { width: 10%; } 
        th:nth-child(2), td:nth-child(2) { width: 34%; text-align: left; padding-left: 5px; font-size: 0.95rem; } 
        
        th { background: #37474f; color: white; font-size: 0.85rem; }
        .group-header { background: #cfd8dc !important; text-align: left !important; padding-left: 10px; font-weight: 800; font-size: 1rem; color: #000; }
        .filled { 
            background: #e1f4fa !important; 
            color: #050505; 
            font-size: 1.0rem; 
            font-weight: 400; 
        }

        /* ក្រឡោនពេលកំពុងផ្សងសំណាង */
        .slot-spinning {
            background-color: #fff59d !important;
            color: #d84315 !important;
            font-weight: 700 !important;
            animation: pulse 0.15s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        /* Buttons Control */
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; justify-content: center; }
        .btn { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 800; font-family: inherit; font-size: 15px; text-transform: uppercase; width: 48%; }
        .btn-img { background: #f39c12; color: white; }
        .btn-excel { background: #2e7d32; color: white; }
        .btn-logout { background: #555; color: white; }
        .btn-start { background: var(--primary); color: white; width: 100%; margin-top: 10px; font-size: 1.1rem; }
        .btn-add { background: var(--accent); color: white; width: auto; flex: 0.4; }

        /* ប៊ូតុង Edit និង Delete */
        .btn-action-edit { cursor: pointer; color: #0288d1; margin-left: 6px; font-size: 0.95rem; }
        .btn-action-del { cursor: pointer; color: #e53935; margin-left: 6px; font-size: 1rem; font-weight: bold; }

        #loginOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--primary); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { background: white; padding: 30px; border-radius: 12px; width: 85%; max-width: 350px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1.5px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        
        .capture-padding { padding: 50px !important; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2 style="color:var(--primary); margin-top:0;">MILITARY SYSTEM</h2>
        <input type="text" id="username" placeholder="ឈ្មោះអ្នកប្រើប្រាស់ (admin)" autocomplete="off">
        <input type="password" id="password" placeholder="លេខសម្ងាត់ (123)" autocomplete="off">
        <button class="btn btn-start" id="loginBtn" onclick="checkLogin()">ចូលប្រើប្រាស់</button>
    </div>
</div>

<div class="container" id="mainApp">
    <!-- ១. Header កាលបរិច្ឆេទ -->
    <div class="calendar-header">
        <button onclick="changeMonth(-1)" style="background:none; border:1px solid white; color:white; padding:6px 12px; border-radius:4px; font-weight:bold; cursor:pointer;">◀</button>
        <h2 id="monthTitle">---</h2>
        <button onclick="changeMonth(1)" style="background:none; border:1px solid white; color:white; padding:6px 12px; border-radius:4px; font-weight:bold; cursor:pointer;">▶</button>
    </div>

    <!-- ២. ផ្នែកគ្រប់គ្រងឈ្មោះសមាជិក (Admin Section) -->
    <div id="adminPanel" class="manage-box" style="display:none;">
        <div class="input-group">
            <input type="text" id="nameIn" placeholder="បញ្ចូលឈ្មោះថ្មី...">
            <select id="groupIn">
                <option value="0">ក្រុមទី ១ (ប្រចាំបញ្ជា)</option>
                <option value="1">ក្រុមទី ២ (ប្រចាំការ)</option>
                <option value="2">ក្រុមទី ៣ (ប្រចាំថ្ងៃ)</option>
            </select>
            <button class="btn btn-add" onclick="addM()">+ បន្ថែម</button>
        </div>
        <div id="tagBox" class="tag-list"></div>
        <hr style="border:none; border-top:1px dashed #c8e6c9; margin:12px 0;">
        
        <!-- កាលបរិច្ឆេទសម្រាប់ Export ចូល Excel -->
        <div style="display:flex; flex-direction:column; gap:8px; text-align:left;">
            <div>
                <label style="font-size:0.85rem; font-weight:bold; color:var(--primary);">🗓️ កាលបរិច្ឆេទចន្ទគតិខ្មែរ (Excel D5):</label>
                <input type="text" id="lunarDateInput" style="width:100%; box-sizing:border-box; font-weight:bold; color:#333;" value="ថ្ងៃសៅរ៍ ៦កើត ខែអស្សុជ ឆ្នាំមមី អដ្ឋស័ក ព.ស. ២៥៧០">
            </div>
            <div>
                <label style="font-size:0.85rem; font-weight:bold; color:var(--primary);">📍 ទីកន្លែង និងកាលបរិច្ឆេទសូរិយគតិ (Excel D6):</label>
                <input type="text" id="solarDateInput" style="width:100%; box-sizing:border-box; font-weight:bold; color:#333;" value="">
            </div>
        </div>
    </div>

    <!-- ៣. ប៊ូតុងទាញយក និងចាកចេញ -->
    <div class="btn-group">
        <button class="btn btn-img" onclick="exportToImage()">🖼️ DOWNLOAD IMAGE</button>
        <button id="excelBtn" class="btn btn-excel" style="display:none;" onclick="exportToExcel()">📊 DOWNLOAD EXCEL</button>
        <button class="btn btn-logout" onclick="logout()">🚪 LOGOUT</button>
        <button class="btn" style="background:#444; color:white; width:100%" onclick="location.reload()">🔄 REFRESH SYSTEM</button>
    </div>

    <!-- ៤. ផ្នែកឈ្មោះរត់ផ្សងសំណាង និងប៊ូតុង START / RESET -->
    <div id="lotteryControl" class="manage-box" style="display:none; margin-bottom: 12px;">
        <div id="displayBox">READY</div>
        <button id="startBtn" class="btn btn-start" onclick="startAuto()">🎲 ចាប់ផ្ដើមរៀបចំ (START)</button>
        <button class="btn" style="background:#78909c; color:white; width:100%; margin-top:5px;" onclick="resetData()">♻️ RESET ទិន្នន័យខែនេះ</button>
    </div>

    <!-- ៥. តារាងឈ្មោះ និងកាលវិភាគ -->
    <div class="table-responsive" id="captureArea" style="background: #fff;">
        <table id="dutyTable">
            <thead>
                <tr>
                    <th width="10%">ល.រ</th>
                    <th>ឈ្មោះ</th>
                    <th colspan="7">ថ្ងៃយាម</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDYEk9HCOL8ClUffxKsA1M2WEKCBSc4zlU",
        databaseURL: "https://my-duty-system-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "my-duty-system",
        appId: "1:430122553040:web:897c088b3d6a0b46f458d5"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // បញ្ជីឈ្មោះថ្មីទាំង ១៥ នាក់
    let membersGroups = JSON.parse(localStorage.getItem('m_list_final_v4')) || [
        ["សោម-ទិ", "អ៊ុយ-សុពល", "ស្វាយ-ប៊ុននី", "ទិត-សិទ្ធា", "សៀង-ប៉ាច"],
        ["ជូ-ច័ន្ទថុល", "វិរៈ-អរុណ", "គឹម-សែនសេរី", "ហែម-ហេន", "អ៊ុន-ដាវ៉េត"],
        ["ស្ងួន-ពៅ", "អ៊ុំ-រិទ្ធី", "នឿន-វណ្ណេត", "ថំ-ធឿង", "សិដ្ឋ-សុផាន់ណា"]
    ];
    let currentDate = new Date();

    function toKhmerNum(num) {
        const khmerNums = ['០', '១', '២', '៣', '៤', '៥', '៦', '៧', '៨', '៩'];
        return num.toString().replace(/[0-9]/g, n => khmerNums[n]);
    }

    function normalizeKhmerName(name) {
        if (!name) return '';
        let s = name.toString().replace(/[-\s]/g, '').trim();
        if (s === 'សួនពៅ' || s === 'ស្ងួនពៅ') return 'ស្ងួនពៅ';
        if (s === 'វិះអរុណ' || s === 'វិរៈអរុណ') return 'វិរៈអរុណ';
        if (s === 'ហែមហែន' || s === 'ហែមហេន') return 'ហែមហេន';
        if (s === 'អ៊ុនដារ៉េត' || s === 'អ៊ុនដាវ៉េត') return 'អ៊ុនដាវ៉េត';
        if (s === 'អ៊ុយសុផល' || s === 'អ៊ុយសុពល') return 'អ៊ុយសុពល';
        if (s === 'ថំថឿង' || s === 'ថំធឿង') return 'ថំធឿង';
        return s;
    }

    window.onload = () => {
        const pInput = document.getElementById('password');
        const uInput = document.getElementById('username');
        if (pInput) {
            pInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') checkLogin();
            });
        }
        if (uInput) {
            uInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') checkLogin();
            });
        }

        const role = sessionStorage.getItem('userRole');
        if (role) {
            showApp(role);
        }
    };

    function checkLogin() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        
        let role = null;
        if (u === 'admin' && p === '123') {
            role = 'ADMIN';
        } else if (u === 'user' && p === '123') {
            role = 'USER';
        }

        if (role) {
            sessionStorage.setItem('userRole', role);
            showApp(role);
        } else {
            alert("ឈ្មោះអ្នកប្រើប្រាស់ ឬលេខសម្ងាត់មិនត្រឹមត្រូវទេ! (admin / 123)");
        }
    }

    function showApp(role) {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        if (role === 'ADMIN') {
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('lotteryControl').style.display = 'block';
            document.getElementById('excelBtn').style.display = 'inline-block';
        } else {
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('lotteryControl').style.display = 'none';
            document.getElementById('excelBtn').style.display = 'none';
        }
        loadData();
    }

    function logout() {
        sessionStorage.clear();
        location.reload();
    }

    function getMonthKey() {
        return "duty_" + currentDate.getFullYear() + "_" + currentDate.getMonth();
    }

    function loadData() {
        const months = ["មករា", "កុម្ភៈ", "មីនា", "មេសា", "ឧសភា", "មិថុនា", "កក្កដា", "សីហា", "កញ្ញា", "តុលា", "វិច្ឆិកា", "ធ្នូ"];
        document.getElementById('monthTitle').innerText = months[currentDate.getMonth()] + " " + currentDate.getFullYear();
        
        const solarInput = document.getElementById('solarDateInput');
        if (solarInput && !solarInput.value) {
            const today = new Date();
            const curDayKh = toKhmerNum(today.getDate().toString().padStart(2, '0'));
            const curMonthKh = months[currentDate.getMonth()];
            const curYearKh = toKhmerNum(currentDate.getFullYear());
            solarInput.value = `ធ្វើនៅសៀមរាប ថ្ងៃទី${curDayKh} ខែ${curMonthKh} ឆ្នាំ${curYearKh}`;
        }

        renderTags();
        db.ref(getMonthKey()).on('value', snap => renderTable(snap.val() || {}));
    }

    function renderTags() {
        const box = document.getElementById('tagBox');
        box.innerHTML = '';
        const role = sessionStorage.getItem('userRole');
        membersGroups.forEach((g, gi) => g.forEach((n, ni) => {
            box.innerHTML += `<div class="tag">
                <span>${n}</span>
                ${role === 'ADMIN' ? `
                    <span class="btn-action-edit" onclick="editM(${gi},${ni})" title="កែឈ្មោះ">✏️</span>
                    <span class="btn-action-del" onclick="delM(${gi},${ni})" title="លុបឈ្មោះ">×</span>
                ` : ''}
            </div>`;
        }));
        localStorage.setItem('m_list_final_v4', JSON.stringify(membersGroups));
    }

    function addM() {
        const n = document.getElementById('nameIn').value.trim();
        const gi = document.getElementById('groupIn').value;
        if(n) {
            membersGroups[gi].push(n);
            document.getElementById('nameIn').value = '';
            loadData();
        }
    }

    function editM(gi, ni) {
        const oldName = membersGroups[gi][ni];
        const newName = prompt("សូមបញ្ចូលឈ្មោះថ្មីជំនួស (« " + oldName + " ») ៖", oldName);
        if (newName && newName.trim() !== "" && newName.trim() !== oldName) {
            const trimmedName = newName.trim();
            db.ref(getMonthKey()).once('value', snap => {
                const val = snap.val() || {};
                if (val[oldName]) {
                    val[trimmedName] = val[oldName];
                    delete val[oldName];
                    db.ref(getMonthKey()).set(val);
                }
            });
            membersGroups[gi][ni] = trimmedName;
            localStorage.setItem('m_list_final_v4', JSON.stringify(membersGroups));
            loadData();
        }
    }

    function delM(gi, ni) {
        if(confirm("តើអ្នកពិតជាចង់លុបឈ្មោះសមាជិកនេះមែនទេ?")) {
            membersGroups[gi].splice(ni, 1);
            loadData();
        }
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        const titles = ["ប្រចាំបញ្ជា", "ប្រចាំការ", "ប្រចាំថ្ងៃ"];
        const role = sessionStorage.getItem('userRole');

        membersGroups.forEach((g, gi) => {
            tbody.innerHTML += `<tr><td colspan="9" class="group-header">ក្រុមទី ${gi+1} (${titles[gi]})</td></tr>`;
            g.forEach((n, ni) => {
                let days = data[n];
                if (!days) {
                    for (let key in data) {
                        if (normalizeKhmerName(key) === normalizeKhmerName(n)) {
                            days = data[key];
                            break;
                        }
                    }
                }
                days = days || ["","","","","","",""];

                let cellsHtml = days.map((d, cIndex) => 
                    `<td id="cell_${encodeURIComponent(n)}_${cIndex}" class="${d ? 'filled' : ''}">${d}</td>`
                ).join('');

                tbody.innerHTML += `<tr>
                    <td>${ni+1}</td>
                    <td style="text-align:left; padding-left:5px;">
                        ${n}
                        ${role === 'ADMIN' ? `<span class="btn-action-edit" onclick="editM(${gi},${ni})" title="កែប្រែឈ្មោះ">✏️</span>` : ''}
                    </td>
                    ${cellsHtml}
                </tr>`;
            });
        });
    }

    /* មុខងារ Random បែបស្លុតលឿនរហ័ស */
    async function startAuto() {
        const btn = document.getElementById('startBtn');
        btn.disabled = true;
        let flat = [];
        membersGroups.forEach((g, gi) => g.forEach(n => flat.push({n, gi})));
        let spinList = [...flat].sort(() => Math.random() - 0.5);
        let groupUsed = {g0:[], g1:[], g2:[]};

        const total = new Date(currentDate.getFullYear(), currentDate.getMonth()+1, 0).getDate();

        for(let item of spinList) {
            for(let t = 0; t < 3; t++) {
                document.getElementById('displayBox').innerText = flat[Math.floor(Math.random()*flat.length)].n;
                await new Promise(r => setTimeout(r, 40));
            }
            document.getElementById('displayBox').innerText = "👉 " + item.n;

            let sDay = Math.floor(Math.random()*5)+1;
            while(groupUsed['g'+item.gi].includes(sDay)) sDay = (sDay%5)+1;
            groupUsed['g'+item.gi].push(sDay);

            let days = ["","","","","","",""];
            for(let d=sDay, c=0; d<=total && c<7; d+=5, c++) {
                days[c] = d.toString().padStart(2, '0');
            }

            let validCols = [];
            for(let c = 0; c < 7; c++) {
                const el = document.getElementById(`cell_${encodeURIComponent(item.n)}_${c}`);
                if (days[c] !== "" && el) {
                    el.classList.add('slot-spinning');
                    validCols.push({ index: c, el: el, target: days[c] });
                } else if(el) {
                    el.innerText = "";
                    el.classList.remove('filled', 'slot-spinning');
                }
            }

            for(let spin = 0; spin < 2; spin++) {
                validCols.forEach(col => {
                    col.el.innerText = (Math.floor(Math.random() * total) + 1).toString().padStart(2, '0');
                });
                await new Promise(r => setTimeout(r, 35));
            }

            for(let col of validCols) {
                col.el.innerText = col.target;
                col.el.classList.remove('slot-spinning');
                col.el.classList.add('filled');
                await new Promise(r => setTimeout(r, 40));
            }

            db.ref(getMonthKey()).update({[item.n]: days});
            await new Promise(r => setTimeout(r, 60)); 
        }

        document.getElementById('displayBox').innerText = "🎉 ចាប់ឆ្នោតរួចរាល់ ✨";
        btn.disabled = false;
    }

    function changeMonth(s) {
        currentDate.setMonth(currentDate.getMonth()+s);
        const months = ["មករា", "កុម្ភៈ", "មីនា", "មេសា", "ឧសភា", "មិថុនា", "កក្កដា", "សីហា", "កញ្ញា", "តុលា", "វិច្ឆិកា", "ធ្នូ"];
        const solarInput = document.getElementById('solarDateInput');
        if (solarInput) {
            const today = new Date();
            const curDayKh = toKhmerNum(today.getDate().toString().padStart(2, '0'));
            solarInput.value = `ធ្វើនៅសៀមរាប ថ្ងៃទី${curDayKh} ខែ${months[currentDate.getMonth()]} ឆ្នាំ${toKhmerNum(currentDate.getFullYear())}`;
        }
        loadData();
    }

    function resetData() {
        if(confirm("តើអ្នកពិតជាចង់លុបទិន្នន័យខែនេះទាំងអស់ឡើងវិញមែនទេ?")) {
            db.ref(getMonthKey()).remove();
        }
    }

    /* =========================================================================
       មុខងារ EXCEL (ExcelJS): កែសម្រួលលែងស៊ីគែម និងបំពេញគ្រប់ ១៥នាក់ ១០០%
       ========================================================================= */
    async function exportToExcel() {
        const excelBtn = document.getElementById('excelBtn');
        const oldText = excelBtn.innerText;
        excelBtn.innerText = "⏳ កំពុងដំណើរការ...";
        excelBtn.disabled = true;

        try {
            // ១. ទាញយកទិន្នន័យពី Firebase
            const snap = await db.ref(getMonthKey()).once('value');
            const dutyData = snap.val() || {};

            // ២. ទាញយក file template.xlsx
            const response = await fetch('template.xlsx');
            if (!response.ok) {
                throw new Error("រកមិនឃើញ file template.xlsx ទេ! សូមប្រាកដថាបាន upload ដាក់ក្នុង GitHub រួចរាល់។");
            }
            const arrayBuffer = await response.arrayBuffer();

            // ៣. អានជាមួយ ExcelJS
            const workbook = new ExcelJS.Workbook();
            await workbook.xlsx.load(arrayBuffer);
            const worksheet = workbook.worksheets[0];

            // ៤. កែសម្រួលទទឹងជួរឈរ C ដល់ I កុំឱ្យធំពេក (បង្រួញមក 5.5) ដើម្បីកុំឱ្យស៊ីគែម
            for (let col = 3; col <= 9; col++) {
                worksheet.getColumn(col).width = 5.5;
            }
            // កំណត់ការបោះពុម្ពឱ្យ Fit ស្អាតក្នុង ១ទំព័រ A4
            worksheet.pageSetup = {
                orientation: 'portrait',
                paperSize: 9, // A4
                fitToPage: true,
                fitToWidth: 1,
                fitToHeight: 1,
                margins: { left: 0.4, right: 0.4, top: 0.5, bottom: 0.5, header: 0.3, footer: 0.3 }
            };

            const months = ["មករា", "កុម្ភៈ", "មីនា", "មេសា", "ឧសភា", "មិថុនា", "កក្កដា", "សីហា", "កញ្ញា", "តុលា", "វិច្ឆិកា", "ធ្នូ"];
            const currentMonthName = months[currentDate.getMonth()];
            const khmerYear = toKhmerNum(currentDate.getFullYear());

            // ៥. បំពេញកាលបរិច្ឆេទចន្ទគតិខ្មែរចូល D5
            const lunarInput = document.getElementById('lunarDateInput');
            if (lunarInput && lunarInput.value.trim() !== "") {
                const cellD5 = worksheet.getCell('D5');
                if (cellD5) cellD5.value = lunarInput.value.trim();
            }

            // ៦. បំពេញកាលបរិច្ឆេទសូរិយគតិចូល D6
            const solarInput = document.getElementById('solarDateInput');
            const cellD6 = worksheet.getCell('D6');
            if (cellD6 && solarInput && solarInput.value.trim() !== "") {
                cellD6.value = solarInput.value.trim();
            }

            // ៧. ធ្វើបច្ចុប្បន្នភាពចំណងជើងតារាងត្រង់ A8
            const cellA8 = worksheet.getCell('A8');
            if (cellA8) {
                cellA8.value = `តារាងវេន ប្រចាំបញ្ជា ប្រចាំការ និងប្រចាំថ្ងៃ ខែ${currentMonthName} ឆ្នាំ${khmerYear}`;
            }

            // ៨. បំពេញឈ្មោះ និងថ្ងៃយាមតាមជួរដេកជាក់ស្តែង (Row 11-15, 17-21, 23-27)
            const rowMap = [
                [11, 12, 13, 14, 15], // ក្រុមទី ១
                [17, 18, 19, 20, 21], // ក្រុមទី ២
                [23, 24, 25, 26, 27]  // ក្រុមទី ៣
            ];

            membersGroups.forEach((group, gi) => {
                group.forEach((name, ni) => {
                    const targetRow = rowMap[gi][ni];
                    
                    // កែសម្រួលឈ្មោះក្នុង Column B ឱ្យត្រឹមត្រូវ ១០០%
                    worksheet.getCell(`B${targetRow}`).value = name;

                    // ស្វែងរកថ្ងៃយាមរបស់ឈ្មោះនេះក្នុងទិន្នន័យ dutyData
                    let days = dutyData[name];
                    if (!days) {
                        for (let key in dutyData) {
                            if (normalizeKhmerName(key) === normalizeKhmerName(name)) {
                                days = dutyData[key];
                                break;
                            }
                        }
                    }
                    days = days || [];

                    // បំពេញលេខថ្ងៃយាមចូល Column C ដល់ I (Cols 3 ដល់ 9)
                    for (let c = 0; c < 7; c++) {
                        const targetCell = worksheet.getRow(targetRow).getCell(3 + c);
                        targetCell.value = days[c] || "";
                    }
                });
            });

            // ៩. ទាញយកឯកសារ Excel ចេញមកក្រៅ
            const buffer = await workbook.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
            const fileName = `Duty_${document.getElementById('monthTitle').innerText}.xlsx`;
            saveAs(blob, fileName);

        } catch (error) {
            console.error(error);
            alert("បញ្ហា Excel: " + error.message);
        } finally {
            excelBtn.innerText = oldText;
            excelBtn.disabled = false;
        }
    }

    function exportToImage() {
        const area = document.getElementById("captureArea");
        area.classList.add('capture-padding');
        
        const editBtns = document.querySelectorAll('.btn-action-edit');
        editBtns.forEach(el => el.style.display = 'none');

        html2canvas(area, { scale: 3, backgroundColor: "#ffffff" }).then(canvas => {
            area.classList.remove('capture-padding');
            editBtns.forEach(el => el.style.display = 'inline');
            const link = document.createElement('a');
            link.download = `Duty_${document.getElementById('monthTitle').innerText}.png`;
            link.href = canvas.toDataURL();
            link.click();
        });
    }
</script>
