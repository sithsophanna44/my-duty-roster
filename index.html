<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធប្រតិទិនយាម - Full Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #004d40;
            --accent: #ff6f00;
            --bg-body: #eceff1;
            --bg-container: #ffffff;
            --text-main: #212121;
            --border-color: #000000;
        }

        body { font-family: 'Kantumruy Pro', sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; padding: 10px; font-size: 16px; }
        .container { background: var(--bg-container); max-width: 1200px; margin: auto; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid #cfd8dc; }
        
        /* Header */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; background: var(--primary); color: white; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
        .calendar-header h2 { margin: 0; font-size: 1.2rem; }

        /* Management Panel (Add/Edit/Delete) */
        .manage-box { background: #f1f8e9; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #c8e6c9; }
        .input-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .input-group input, .input-group select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 150px; font-family: inherit; }
        
        .member-tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { background: white; padding: 5px 12px; border-radius: 20px; border: 1px solid #ddd; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
        .btn-tag-edit { color: blue; cursor: pointer; border: none; background: none; font-size: 14px; }
        .btn-tag-del { color: red; cursor: pointer; border: none; background: none; font-weight: bold; font-size: 16px; }

        /* Spin Box */
        .spin-box { text-align: center; border: 2px solid var(--primary); padding: 25px; border-radius: 10px; background: #fff; margin-bottom: 20px; }
        #displayBox { font-size: 2.5rem; font-weight: 700; color: var(--primary); min-height: 60px; margin-bottom: 10px; }
        #statusMsg { font-size: 16px; color: #555; font-weight: 600; margin-bottom: 20px; }

        /* Table Style & Responsive */
        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .duty-table { width: 100%; border-collapse: collapse; background: white; border: 2px solid var(--border-color); min-width: 800px; }
        .duty-table th, .duty-table td { border: 1.5px solid var(--border-color); padding: 12px; text-align: center; font-size: 16px; font-weight: 600; }
        .duty-table th { background: #37474f; color: white; }
        .group-header { background: #cfd8dc !important; color: #000 !important; text-align: left !important; padding-left: 20px; font-size: 18px; font-weight: 700; }
        .name-cell { text-align: left !important; padding-left: 20px; color: var(--primary); }
        .filled { background: #fff9c4 !important; color: #b71c1c; font-size: 18px; font-weight: 700; }
        .active-row { background: #e0f2f1 !important; border: 2.5px solid var(--accent) !important; }

        /* Buttons Control */
        .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 12px 25px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: 700; transition: 0.2s; font-family: inherit; }
        .btn-start { background: var(--primary); color: white; }
        .btn-excel { background: #2e7d32; color: white; }
        .btn-reset { background: #78909c; color: white; }
        .btn-add { background: var(--accent); color: white; }
        .btn-nav { background: rgba(255,255,255,0.2); color: white; border: 1px solid white; padding: 5px 10px; border-radius: 4px; cursor: pointer; }

        @media (max-width: 600px) {
            body { padding: 5px; }
            .container { padding: 10px; }
            #displayBox { font-size: 1.8rem; }
            .btn { width: 100%; }
        }

        @media print { .manage-box, .spin-box, .btn-group, .calendar-header button { display: none; } }
    </style>
</head>
<body>

<div class="container">
    <div class="calendar-header">
        <button class="btn-nav" onclick="changeMonth(-1)">◀</button>
        <h2 id="monthTitle">---</h2>
        <button class="btn-nav" onclick="changeMonth(1)">▶</button>
    </div>

    <div class="manage-box">
        <div class="input-group">
            <input type="text" id="newNameInput" placeholder="ឈ្មោះសមាជិកថ្មី...">
            <select id="groupSelect">
                <option value="0">ក្រុមទី ១ (ប្រចាំបញ្ជា)</option>
                <option value="1">ក្រុមទី ២ (ប្រចាំការ)</option>
                <option value="2">ក្រុមទី ៣ (ប្រចាំថ្ងៃ)</option>
            </select>
            <button class="btn btn-add" onclick="addMember()">+ បន្ថែមឈ្មោះ</button>
        </div>
        <div id="memberTags" class="member-tags"></div>
    </div>

    <div class="spin-box">
        <div id="displayBox">READY</div>
        <div id="statusMsg">ត្រៀមខ្លួន...</div>
        <div class="btn-group">
            <button id="startBtn" class="btn btn-start" onclick="startStepByStep()">🎲 ចាប់ផ្ដើមរៀបចំ (ម្ដងម្នាក់)</button>
            <button class="btn btn-excel" onclick="exportToExcel()">📊 Download Excel</button>
            <button class="btn btn-reset" onclick="resetAll()">♻️ Reset Memory</button>
        </div>
    </div>

    <div class="table-wrapper">
        <table class="duty-table" id="dutyTable">
            <thead>
                <tr>
                    <th width="60">ល.រ</th>
                    <th>នាម និង គោត្តនាម</th>
                    <th colspan="7">កាលបរិច្ឆេទយាម (រំលង ៤ ថ្ងៃ)</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // ទាញយកបញ្ជីឈ្មោះពី LocalStorage ឬប្រើបញ្ជីដើមបើគ្មាន
    let membersGroups = JSON.parse(localStorage.getItem('duty_members_list')) || [
        ["សោម-ទិ", "អ៊ុយ-សុផល", "ស្វាយ-ប៊ុននី", "ទិត-សិទ្ធា", "សៀង-ប៉ាច"],
        ["ជូ-ច័ន្ទថុល", "វិះ-អរុណ", "គឹម-សែនសេរី", "ឃឹម-លុច", "អ៊ុន-ដារ៉េត"],
        ["សួន-ពៅ", "ហែម-ហាន", "នឿន-វណ្ណេត", "អ៊ុំ-វិច្ឆិ", "អ៊ុន-មករា"]
    ];

    let currentDate = new Date();
    let groupUsedOffsets = { g0: [], g1: [], g2: [] };

    function getMonthKey(date) { return "duty_data_" + date.getFullYear() + "_" + date.getMonth(); }

    function init() {
        const months = ["មករា", "កុម្ភៈ", "មីនា", "មេសា", "ឧសភា", "មិថុនា", "កក្កដា", "សីហា", "កញ្ញា", "តុលា", "វិច្ឆិកា", "ធ្នូ"];
        document.getElementById('monthTitle').innerText = "ខែ" + months[currentDate.getMonth()] + " ឆ្នាំ " + currentDate.getFullYear();
        
        renderMemberTags();
        renderTable();
    }

    // បង្ហាញ Tag ឈ្មោះសម្រាប់ Edit/Delete
    function renderMemberTags() {
        const box = document.getElementById('memberTags');
        box.innerHTML = '';
        membersGroups.forEach((group, gIdx) => {
            group.forEach((name, nIdx) => {
                const tag = document.createElement('div');
                tag.className = 'tag';
                tag.innerHTML = `${name} 
                    <button class="btn-tag-edit" onclick="editMember(${gIdx}, ${nIdx})">✎</button>
                    <button class="btn-tag-del" onclick="deleteMember(${gIdx}, ${nIdx})">×</button>`;
                box.appendChild(tag);
            });
        });
        localStorage.setItem('duty_members_list', JSON.stringify(membersGroups));
    }

    function addMember() {
        const name = document.getElementById('newNameInput').value.trim();
        const gIdx = document.getElementById('groupSelect').value;
        if (name) {
            membersGroups[gIdx].push(name);
            document.getElementById('newNameInput').value = '';
            init();
        }
    }

    function editMember(gIdx, nIdx) {
        const oldName = membersGroups[gIdx][nIdx];
        const newName = prompt("កែប្រែឈ្មោះសមាជិក៖", oldName);
        if (newName && newName.trim() !== "") {
            membersGroups[gIdx][nIdx] = newName.trim();
            init();
        }
    }

    function deleteMember(gIdx, nIdx) {
        if (confirm("តើអ្នកចង់លុបឈ្មោះ '" + membersGroups[gIdx][nIdx] + "' ចេញមែនទេ?")) {
            membersGroups[gIdx].splice(nIdx, 1);
            init();
        }
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        const savedData = JSON.parse(localStorage.getItem(getMonthKey(currentDate))) || {};
        const groupTitles = ["ក្រុមទី ១ (ប្រចាំបញ្ជា)", "ក្រុមទី ២ (ប្រចាំការ)", "ក្រុមទី ៣ (ប្រចាំថ្ងៃ)"];
        
        membersGroups.forEach((group, gIdx) => {
            tbody.innerHTML += `<tr><td colspan="9" class="group-header">${groupTitles[gIdx]}</td></tr>`;
            group.forEach((name, nIdx) => {
                const days = savedData[name] || ["", "", "", "", "", "", ""];
                const safeId = name.replace(/\s+/g, '-');
                tbody.innerHTML += `<tr id="row-${safeId}">
                    <td>${(nIdx + 1).toString().padStart(2, '0')}</td>
                    <td class="name-cell">${name}</td>
                    ${days.map(d => `<td class="${d ? 'filled' : ''}">${d}</td>`).join('')}
                </tr>`;
            });
        });
        document.getElementById('startBtn').disabled = Object.keys(savedData).length > 0;
    }

    async function startStepByStep() {
        document.getElementById('startBtn').disabled = true;
        groupUsedOffsets = { g0: [], g1: [], g2: [] };
        
        let flatMembers = [];
        membersGroups.forEach((group, gIdx) => {
            group.forEach(name => flatMembers.push({name, gIdx}));
        });
        
        let spinList = [...flatMembers].sort(() => Math.random() - 0.5);
        let monthData = {};

        for (let i = 0; i < flatMembers.length; i++) {
            document.getElementById('statusMsg').innerText = "កំពុងរៀបចំសមាជិកទី " + (i + 1) + "...";
            
            const selected = await new Promise(res => {
                let timer = 0;
                let itv = setInterval(() => {
                    document.getElementById('displayBox').innerText = spinList[Math.floor(Math.random() * spinList.length)].name;
                    if ((timer += 50) > 800) {
                        clearInterval(itv);
                        res(document.getElementById('displayBox').innerText);
                    }
                }, 50);
            });

            const currentMember = flatMembers.find(m => m.name === selected);
            monthData[selected] = fillData(selected, currentMember.gIdx);
            spinList = spinList.filter(m => m.name !== selected);

            await new Promise(res => setTimeout(res, 1000));
        }

        localStorage.setItem(getMonthKey(currentDate), JSON.stringify(monthData));
        document.getElementById('displayBox').innerText = "រួចរាល់! ✨";
        document.getElementById('statusMsg').innerText = "ទិន្នន័យត្រូវបានរក្សាទុក។";
    }

    function fillData(name, gIdx) {
        const gKey = 'g' + gIdx;
        let startDay = Math.floor(Math.random() * 5) + 1;
        while (groupUsedOffsets[gKey].includes(startDay)) startDay = (startDay % 5) + 1;
        groupUsedOffsets[gKey].push(startDay);

        const totalDays = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
        const safeId = name.replace(/\s+/g, '-');
        const row = document.getElementById(`row-${safeId}`);
        
        if (row) row.classList.add('active-row');
        
        let days = ["", "", "", "", "", "", ""];
        for (let d = startDay, c = 0; d <= totalDays && c < 7; d += 5, c++) {
            days[c] = d.toString().padStart(2, '0');
            if (row) {
                row.cells[c + 2].innerText = days[c];
                row.cells[c + 2].classList.add('filled');
            }
        }
        
        setTimeout(() => { if (row) row.classList.remove('active-row'); }, 800);
        return days;
    }

    function changeMonth(s) { currentDate.setMonth(currentDate.getMonth() + s); init(); }
    
    function resetAll() { 
        if(confirm("តើអ្នកចង់សម្អាតទិន្នន័យខែនេះមែនទេ?")) { 
            localStorage.removeItem(getMonthKey(currentDate)); 
            init(); 
        } 
    }

    function exportToExcel() {
        const table = document.getElementById("dutyTable");
        const wb = XLSX.utils.table_to_book(table, { sheet: "Duty_Sheet" });
        const ws = wb.Sheets["Duty_Sheet"];
        ws['!cols'] = [{ wch: 6 }, { wch: 25 }, { wch: 6 }, { wch: 6 }, { wch: 6 }, { wch: 6 }, { wch: 6 }, { wch: 6 }, { wch: 6 }];
        XLSX.writeFile(wb, `Duty_${document.getElementById('monthTitle').innerText.replace(/\s/g, '_')}.xlsx`);
    }

    window.onload = init;
</script>
</body>
</html>
