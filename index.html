<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធប្រតិទិនយាម - ជំនាន់កែសម្រួលលេខ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Leelawadee UI', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { background: white; max-width: 1100px; margin: auto; padding: 20px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #003366; color: white; padding: 15px; border-radius: 8px; }
        .calendar-header h2 { margin: 0; }
        .btn-nav { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 15px; cursor: pointer; border-radius: 5px; }
        .spin-box { text-align: center; border: 2px dashed #1a73e8; padding: 20px; border-radius: 10px; background: white; margin-bottom: 20px; }
        #displayBox { font-size: 35px; font-weight: bold; color: #1a73e8; min-height: 50px; }
        .duty-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .duty-table th, .duty-table td { border: 1px solid #000; padding: 12px; text-align: center; }
        .duty-table th { background: #f2f2f2; }
        .group-header { background: #003366 !important; color: white; text-align: left !important; padding-left: 15px; font-weight: bold; }
        .filled { background: #fffde7; font-weight: bold; color: #d32f2f; }
        .action-btns { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        .btn { padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; }
        .btn-start { background: #28a745; }
        .btn-stop { background: #dc3545; }
        .btn-excel { background: #1d6f42; }
        @media print { .spin-box, .action-btns, .btn-nav { display: none; } }
    </style>
</head>
<body>

<div class="container">
    <div class="calendar-header">
        <button class="btn-nav" onclick="changeMonth(-1)">◀ ខែមុន</button>
        <h2 id="monthTitle">---</h2>
        <button class="btn-nav" onclick="changeMonth(1)">ខែបន្ទាប់ ▶</button>
    </div>

    <div class="spin-box">
        <div id="displayBox">---</div>
        <div class="action-btns">
            <button id="startBtn" class="btn btn-start" onclick="startRolling()">▶ វិលឈ្មោះខែថ្មី</button>
            <button id="stopBtn" class="btn btn-stop" onclick="stopRolling()" disabled>🛑 បញ្ឈប់ម្ដងម្នាក់</button>
            <button class="btn btn-excel" onclick="exportToExcel()">📊 ទាញយក Excel</button>
        </div>
    </div>

    <table class="duty-table" id="dutyTable">
        <thead>
            <tr>
                <th>ល.រ</th>
                <th width="30%">នាម និង គោត្តនាម</th>
                <th colspan="6">កាលបរិច្ឆេទយាម</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    let defaultMembers = [
        "សោម-ទិ", "អ៊ុយ-សុផល", "ស្វាយ-ប៊ុននី", "ទិត-សិទ្ធា", "សៀង-ប៉ាច",
        "ជូ-ច័ន្ទថុល", "វិះ-អរុណ", "គឹម-សែនសេរី", "ឃឹម-លុច", "អ៊ុន-ដារ៉េត",
        "សួន-ពៅ", "ហែម-ហាន", "នឿន-វណ្ណេត", "អ៊ុំ-វិច្ឆិ", "អ៊ុន-មករា"
    ];

    let currentDate = new Date();
    let masterList = [];
    let spinInterval;
    let groupCounters = { g1: 0, g2: 0, g3: 0 };

    function getMonthName(date) {
        const months = ["មករា", "កុម្ភៈ", "មីនា", "មេសា", "ឧសភា", "មិថុនា", "កក្កដា", "សីហា", "កញ្ញា", "តុលា", "វិច្ឆិកា", "ធ្នូ"];
        return months[date.getMonth()] + " " + date.getFullYear();
    }

    function daysInMonth(month, year) {
        return new Date(year, month + 1, 0).getDate();
    }

    function changeMonth(step) {
        currentDate.setMonth(currentDate.getMonth() + step);
        updateUI();
    }

    function updateUI() {
        document.getElementById('monthTitle').innerText = getMonthName(currentDate);
        renderTableSkeleton();
    }

    function renderTableSkeleton() {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';
        const groups = ["ប្រចាំបញ្ជា", "ប្រចាំការ", "ប្រចាំថ្ងៃ"];
        groups.forEach((g, gIdx) => {
            tableBody.innerHTML += `<tr><td colspan="8" class="group-header">${g}</td></tr>`;
            for (let i = 0; i < 5; i++) {
                const name = defaultMembers[gIdx * 5 + i];
                tableBody.innerHTML += `
                    <tr id="row-${name}">
                        <td>${(i + 1).toString().padStart(2, '0')}</td>
                        <td style="text-align:left; padding-left:10px;">${name}</td>
                        <td class="d-1"></td><td class="d-2"></td><td class="d-3"></td>
                        <td class="d-4"></td><td class="d-5"></td><td class="d-6"></td>
                    </tr>`;
