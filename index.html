<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធប្រតិទិនយាម - ជំនាន់ស្ថេរភាព</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Leelawadee UI', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { background: white; max-width: 1000px; margin: auto; padding: 25px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.15); }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #003366; color: white; padding: 15px; border-radius: 10px; }
        .spin-box { text-align: center; border: 3px dashed #1a73e8; padding: 25px; border-radius: 12px; background: #fff; margin-bottom: 25px; }
        #displayBox { font-size: 42px; font-weight: bold; color: #1a73e8; min-height: 60px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; }
        .duty-table { width: 100%; border-collapse: collapse; background: white; }
        .duty-table th, .duty-table td { border: 1px solid #000; padding: 12px; text-align: center; }
        .group-header { background: #003366 !important; color: white; text-align: left !important; padding-left: 20px; font-weight: bold; }
        .filled { background: #fffde7; font-weight: bold; color: #d32f2f; }
        .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 12px 28px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; color: white; transition: 0.2s; }
        .btn-start { background: #28a745; }
        .btn-stop { background: #dc3545; }
        .btn-excel { background: #1d6f42; }
        .btn-reset { background: #6c757d; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .status-msg { margin-top: 10px; font-size: 14px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <div class="calendar-header">
        <button onclick="changeMonth(-1)" style="cursor:pointer; color:white; background:none; border:1px solid white; padding:5px 10px; border-radius:5px;">◀ ខែមុន</button>
        <h2 id="monthTitle">---</h2>
        <button onclick="changeMonth(1)" style="cursor:pointer; color:white; background:none; border:1px solid white; padding:5px 10px; border-radius:5px;">ខែបន្ទាប់ ▶</button>
    </div>

    <div class="spin-box">
        <div id="displayBox">---</div>
        <div id="statusMsg" class="status-msg">សូមចុច "ចាប់ផ្ដើមវិល"</div>
        <div class="btn-group">
            <button id="startBtn" class="btn btn-start" onclick="startSpinning()">▶ ចាប់ផ្ដើមវិល</button>
            <button id="stopBtn" class="btn btn-stop" onclick="stopOne()" disabled>🛑 បញ្ឈប់ម្តងម្នាក់</button>
            <button class="btn btn-excel" onclick="exportToExcel()">📊 Excel</button>
            <button class="btn btn-reset" onclick="resetAll()">♻️ Reset</button>
        </div>
    </div>

    <table class="duty-table" id="dutyTable">
        <thead>
            <tr>
                <th>ល.រ</th>
                <th width="35%">នាម និង គោត្តនាម</th>
                <th colspan="6">កាលបរិច្ឆេទយាម (រំលង ៤ថ្ងៃ)</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    const members = [
        "សោម-ទិ", "អ៊ុយ-សុផល", "ស្វាយ-ប៊ុននី", "ទិត-សិទ្ធា", "សៀង-ប៉ាច",
        "ជូ-ច័ន្ទថុល", "វិះ-អរុណ", "គឹម-សែនសេរី", "ឃឹម-លុច", "អ៊ុន-ដារ៉េត",
        "សួន-ពៅ", "ហែម-ហាន", "នឿន-វណ្ណេត", "អ៊ុំ-វិច្ឆិ", "អ៊ុន-មករា"
    ];

    let currentDate = new Date();
    let spinList = [];
    let interval = null;
    let usedOffsets = { g1: [], g2: [], g3: [] };

    function init() {
        const months = ["មករា", "កុម្ភៈ", "មីនា", "មេសា", "ឧសភា", "មិថុនា", "កក្កដា", "សីហា", "កញ្ញា", "តុលា", "វិច្ឆិកា", "ធ្នូ"];
        document.getElementById('monthTitle').innerText = months[currentDate.getMonth()] + " " + currentDate.getFullYear();
        
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        const groups = ["ប្រចាំបញ្ជា", "ប្រចាំការ", "ប្រចាំថ្ងៃ"];
        groups.forEach((g, idx) => {
            tbody.innerHTML += `<tr><td colspan="8" class="group-header">${g}</td></tr>`;
            for (let i = 0; i < 5; i++) {
                const name = members[idx * 5 + i];
                tbody.innerHTML += `<tr id="row-${name}"><td>${(i+1).toString().padStart(2, '0')}</td><td style="text-align:left;padding-left:15px;">${name}</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`;
            }
        });
    }

    function changeMonth(step) {
        currentDate.setMonth(currentDate.getMonth() + step);
        init();
    }

    function startSpinning() {
        if (interval) return;
        spinList = [...members].filter(n => {
            const row = document.getElementById(`row-${n}`);
            return row && row.cells[2].innerText === "";
        });

        if (spinList.length === 0) {
            alert("ឈ្មោះទាំងអស់ត្រូវបានបំពេញរួចរាល់!");
            return;
        }

        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        document.getElementById('statusMsg').innerText = "កំពុងវិល... សូមចុចប៊ូតុងក្រហមដើម្បីបញ្ឈប់";

        interval = setInterval(() => {
            const pick = spinList[Math.floor(Math.random() * spinList.length)];
            document.getElementById('displayBox').innerText = pick;
        }, 60);
    }

    function stopOne() {
        clearInterval(interval);
        interval = null;
        
        const name = document.getElementById('displayBox').innerText;
        const nameIdx = members.indexOf(name);
        const gKey = nameIdx < 5 ? 'g1' : (nameIdx < 10 ? 'g2' : 'g3');

        // Logic គណនាថ្ងៃបន្តវេន
        let lastDay = parseInt(localStorage.getItem("lastDay_" + name)) || 0;
        const prevMonthDays = new Date(currentDate.getFullYear(), currentDate.getMonth(), 0).getDate();
        let startDay = (lastDay + 5) - prevMonthDays;
        while (startDay <= 0) startDay += 5;

        // បង្ការការជាន់ថ្ងៃក្នុងក្រុម
        while (usedOffsets[gKey].includes(startDay)) {
            startDay = (startDay % 5) + 1;
        }
        usedOffsets[gKey].push(startDay);

        // បំពេញថ្ងៃ
        const maxDays = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
        const row = document.getElementById(`row-${name}`);
        let cellIdx = 2;
        for (let d = startDay; d <= maxDays; d += 5) {
            if (cellIdx < 8) {
                row.cells[cellIdx].innerText = d.toString().padStart(2, '0');
                row.cells[cellIdx].classList.add('filled');
                cellIdx++;
            }
        }

        localStorage.setItem("lastDay_" + name, startDay + (Math.floor((maxDays - startDay) / 5) * 5));

        document.getElementById('stopBtn').disabled = true;
        document.getElementById('startBtn').disabled = false;
        document.getElementById('statusMsg').innerText = "បានរក្សាទុក " + name + "។ សូមចុច 'ចាប់ផ្ដើមវិល' បន្តទៀត។";
        
        if (spinList.length <= 1) {
            document.getElementById('displayBox').innerText = "ចប់សព្វគ្រប់! ✨";
            document.getElementById('statusMsg').innerText = "សមាជិកទាំងអស់ត្រូវបានរៀបចំរួចរាល់។";
        }
    }

    function resetAll() {
        if(confirm("តើអ្នកចង់សម្អាតទិន្នន័យទាំងអស់ដើម្បីរៀបចំឡើងវិញមែនទេ?")) {
            localStorage.clear();
            usedOffsets = { g1: [], g2: [], g3: [] };
            init();
            document.getElementById('displayBox').innerText = "---";
        }
    }

    function exportToExcel() {
        const wb = XLSX.utils.table_to_book(document.getElementById("dutyTable"));
        XLSX.writeFile(wb, `Torang_Duty_${document.getElementById('monthTitle').innerText}.xlsx`);
    }

    window.onload = init;
</script>
</body>
</html>
