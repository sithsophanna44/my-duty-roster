<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>Military Duty System - Complete Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root { --primary: #004d40; --accent: #ff6f00; --bg: #eceff1; }
        body { font-family: 'Kantumruy Pro', sans-serif; background: var(--bg); margin: 0; padding: 5px; }
        .container { background: white; width: 100%; max-width: 1000px; margin: auto; padding: 10px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none; }
        
        .calendar-header { display: flex; justify-content: space-between; align-items: center; background: var(--primary); color: white; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
        .calendar-header h2 { font-size: 1.1rem; margin: 0; }

        /* Admin Management Panel */
        .manage-box { background: #f1f8e9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1.5px solid #c8e6c9; text-align: center; }
        .input-group { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        input, select { padding: 12px; border: 1px solid #ccc; border-radius: 6px; flex: 1; font-family: inherit; font-size: 14px; min-width: 120px; }
        
        .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; justify-content: center; }
        .tag { background: white; padding: 5px 12px; border-radius: 20px; border: 1px solid #ddd; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }

        #displayBox { font-size: 2rem; font-weight: 800; color: var(--primary); min-height: 55px; margin-bottom: 10px; background: #fff; border: 2px dashed var(--primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; }

        /* Table Style */
        .table-responsive { width: 100%; overflow-x: auto; border: 1.5px solid #000; background: #fff; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; min-width: 650px; }
        th, td { border: 1px solid #000; padding: 10px 5px; text-align: center; font-size: 0.8rem; font-weight: 700; }
        th { background: #37474f; color: white; }
        .group-header { background: #cfd8dc !important; text-align: left !important; padding-left: 10px; font-weight: 800; }
        .filled { background: #fff9c4 !important; color: #b71c1c; font-size: 0.9rem; }

        /* Buttons Control */
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; justify-content: center; }
        .btn { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; font-family: inherit; font-size: 13px; text-transform: uppercase; width: 48%; }
        .btn-img { background: #f39c12; color: white; }
        .btn-excel { background: #2e7d32; color: white; }
        .btn-logout { background: #555; color: white; }
        .btn-start { background: var(--primary); color: white; width: 100%; margin-top: 5px; }
        .btn-add { background: var(--accent); color: white; width: auto; flex: 0.5; }

        #loginOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--primary); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { background: white; padding: 25px; border-radius: 12px; width: 85%; max-width: 320px; text-align: center; }
        
        .capture-padding { padding: 45px !important; } /* គែមធំពេលថតរូប */
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2 style="color:var(--primary)">MILITARY LOGIN</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button class="btn btn-start" onclick="checkLogin()">LOGIN</button>
    </div>
</div>

<div class="container" id="mainApp">
    <div class="calendar-header">
        <button onclick="changeMonth(-1)" style="background:none; border:1px solid white; color:white; padding:5px 10px; border-radius:4px;">◀</button>
        <h2 id="monthTitle">---</h2>
        <button onclick="changeMonth(1)" style="background:none; border:1px solid white; color:white; padding:5px 10px; border-radius:4px;">▶</button>
    </div>

    <div id="adminPanel" class="manage-box" style="display:none;">
        <div class="input-group">
            <input type="text" id="nameIn" placeholder="បញ្ចូលឈ្មោះថ្មី...">
            <select id="groupIn">
                <option value="0">ក្រុមទី ១</option>
                <option value="1">ក្រុមទី ២</option>
                <option value="2">ក្រុមទី ៣</option>
            </select>
            <button class="btn btn-add" onclick="addM()">+ បន្ថែម</button>
        </div>
        <div id="tagBox" class="tag-list"></div>
        <hr>
        <div id="displayBox">READY</div>
        <button id="startBtn" class="btn btn-start" onclick="startAuto()">🎲 ចាប់ផ្ដើមរៀបចំ (START RANDOM)</button>
        <button class="btn" style="background:#78909c; color:white; width:100%; margin-top:5px;" onclick="resetData()">♻️ RESET ទិន្នន័យខែនេះ</button>
    </div>

    <div class="btn-group">
        <button class="btn btn-img" onclick="exportToImage()">🖼️ DOWNLOAD IMAGE</button>
        <button id="excelBtn" class="btn btn-excel" style="display:none;" onclick="exportToExcel()">📊 DOWNLOAD EXCEL</button>
        <button class="btn btn-logout" onclick="logout()">🚪 LOGOUT</button>
        <button class="btn" style="background:#444; color:white; width:100%" onclick="location.reload()">🔄 REFRESH SYSTEM</button>
    </div>

    <div class="table-responsive" id="captureArea" style="background: #fff;">
        <table id="dutyTable">
            <thead>
                <tr>
                    <th width="10%">ល.រ</th>
                    <th>នាម និង គោត្តនាម</th>
                    <th colspan="7">កាលបរិច្ឆេទយាម</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // --- Config Firebase ---
    const firebaseConfig = {
        apiKey: "AIzaSyDYEk9HCOL8ClUffxKsA1M2WEKCBSc4zlU",
        databaseURL: "https://my-duty-system-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "my-duty-system",
        appId: "1:430122553040:web:897c088b3d6a0b46f458d5"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let membersGroups = JSON.parse(localStorage.getItem('m_list_final_v1')) || [
        ["សោម-ទិ", "អ៊ុយ-សុផល", "ស្វាយ-ប៊ុននី", "ទិត-សិទ្ធា", "សៀង-ប៉ាច"],
        ["ជូ-ច័ន្ទថុល", "វិះ-អរុណ", "គឹម-សែនសេរី", "ឃឹម-លុច", "អ៊ុន-ដារ៉េត"],
        ["សួន-ពៅ", "ហែម-ហាន", "នឿន-វណ្ណេត", "អ៊ុំ-វិច្ឆិ", "អ៊ុន-មករា"]
    ];
    let currentDate = new Date();

    window.onload = () => {
        const role = sessionStorage.getItem('userRole');
        if (role) showApp(role);
    };

    function checkLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        let role = (u === 'admin' && p === '123') ? 'ADMIN' : (u === 'user' && p === '123' ? 'USER' : null);
        if (role) { sessionStorage.setItem('userRole', role); showApp(role); }
        else { alert("Login Error!"); }
    }

    function showApp(role) {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        if (role === 'ADMIN') {
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('excelBtn').style.display = 'inline-block';
        }
        loadData();
    }

    function logout() { sessionStorage.clear(); location.reload(); }

    function getMonthKey() { return "duty_" + currentDate.getFullYear() + "_" + currentDate.getMonth(); }

    function loadData() {
        const months = ["មករា", "កុម្ភៈ", "មីនា", "មេសា", "ឧសភា", "មិថុនា", "កក្កដា", "សីហា", "កញ្ញា", "តុលា", "វិច្ឆិកា", "ធ្នូ"];
        document.getElementById('monthTitle').innerText = months[currentDate.getMonth()] + " " + currentDate.getFullYear();
        renderTags();
        db.ref(getMonthKey()).on('value', snap => renderTable(snap.val() || {}));
    }

    function renderTags() {
        const box = document.getElementById('tagBox'); box.innerHTML = '';
        const role = sessionStorage.getItem('userRole');
        membersGroups.forEach((g, gi) => g.forEach((n, ni) => {
            box.innerHTML += `<div class="tag">${n} ${role==='ADMIN' ? `<b onclick="delM(${gi},${ni})" style="color:red; cursor:pointer;">×</b>` : ''}</div>`;
        }));
        localStorage.setItem('m_list_final_v1', JSON.stringify(membersGroups));
    }

    function addM() {
        const n = document.getElementById('nameIn').value.trim();
        const gi = document.getElementById('groupIn').value;
        if(n) { membersGroups[gi].push(n); document.getElementById('nameIn').value=''; loadData(); }
    }

    function delM(gi, ni) { if(confirm("លុបឈ្មោះសមាជិក?")) { membersGroups[gi].splice(ni, 1); loadData(); } }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
        const titles = ["ប្រចាំបញ្ជា", "ប្រចាំការ", "ប្រចាំថ្ងៃ"];
        membersGroups.forEach((g, gi) => {
            tbody.innerHTML += `<tr><td colspan="9" class="group-header">ក្រុមទី ${gi+1} (${titles[gi]})</td></tr>`;
            g.forEach((n, ni) => {
                const days = data[n] || ["","","","","","",""];
                tbody.innerHTML += `<tr><td>${ni+1}</td><td style="text-align:left; padding-left:5px;">${n}</td>${days.map(d=>`<td class="${d?'filled':''}">${d}</td>`).join('')}</tr>`;
            });
        });
    }

    async function startAuto() {
        const btn = document.getElementById('startBtn'); btn.disabled = true;
        let flat = []; membersGroups.forEach((g, gi) => g.forEach(n => flat.push({n, gi})));
        let spinList = [...flat].sort(() => Math.random() - 0.5);
        let groupUsed = {g0:[], g1:[], g2:[]};

        for(let item of spinList) {
            let timer = 0;
            while(timer < 300) {
                document.getElementById('displayBox').innerText = flat[Math.floor(Math.random()*flat.length)].n;
                await new Promise(r => setTimeout(r, 50));
                timer += 50;
            }
            document.getElementById('displayBox').innerText = item.n;
            let sDay = Math.floor(Math.random()*5)+1;
            while(groupUsed['g'+item.gi].includes(sDay)) sDay = (sDay%5)+1;
            groupUsed['g'+item.gi].push(sDay);

            let days = ["","","","","","",""];
            const total = new Date(currentDate.getFullYear(), currentDate.getMonth()+1, 0).getDate();
            for(let d=sDay, c=0; d<=total && c<7; d+=5, c++) days[c] = d.toString().padStart(2, '0');
            db.ref(getMonthKey()).update({[item.n]: days});
            await new Promise(r => setTimeout(r, 400));
        }
        document.getElementById('displayBox').innerText = "រួចរាល់ ✨"; btn.disabled = false;
    }

    function changeMonth(s) { currentDate.setMonth(currentDate.getMonth()+s); loadData(); }
    function resetData() { if(confirm("Reset data?")) db.ref(getMonthKey()).remove(); }
    
    // មុខងារ Excel
    function exportToExcel() { 
        XLSX.writeFile(XLSX.utils.table_to_book(document.getElementById("dutyTable")), `Duty_${document.getElementById('monthTitle').innerText}.xlsx`); 
    }

    // មុខងារ Image
    function exportToImage() {
        const area = document.getElementById("captureArea");
        area.classList.add('capture-padding');
        html2canvas(area, { scale: 3, backgroundColor: "#ffffff" }).then(canvas => {
            area.classList.remove('capture-padding');
            const link = document.createElement('a');
            link.download = `Duty_${document.getElementById('monthTitle').innerText}.png`;
            link.href = canvas.toDataURL();
            link.click();
        });
    }
</script>
</body>
</html>
