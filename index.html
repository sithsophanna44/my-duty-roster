<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>តារាងយាម ៥នាក់ - រំលង ៤ថ្ងៃ</title>
    <style>
        body { font-family: 'Leelawadee UI', sans-serif; background: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; width: 100%; max-width: 850px; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #003366; }
        .info-panel { background: #e8f0fe; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; line-height: 1.6; }
        
        .input-group { margin-bottom: 20px; }
        textarea { width: 100%; height: 60px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-family: inherit; }
        
        .btn-random { width: 100%; padding: 12px; background: #f39c12; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-random:hover { background: #e67e22; }

        .duty-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .duty-table th, .duty-table td { border: 1px solid #333; padding: 12px; text-align: center; }
        .duty-table th { background: #f2f2f2; }
        .name-cell { text-align: left !important; font-weight: bold; background: #fafafa; }
    </style>
</head>
<body>

<div class="container">
    <h2>តារាងយាមប្រចាំការប្រចាំខែ (Cycle ៥ ថ្ងៃ)</h2>
    
    <div class="info-panel">
        <strong>លក្ខខណ្ឌ៖</strong> សមាជិក ៥ នាក់ ប្តូរវេនគ្នាម្នាក់ ១ ថ្ងៃ។ <br>
        <strong>លទ្ធផល៖</strong> ម្នាក់ៗនឹងធ្វើការ ១ ថ្ងៃ និង <strong>សម្រាករំលង ៤ ថ្ងៃ</strong> ទើបដល់វេនម្តងទៀត។
    </div>

    <div class="input-group">
        <label>បញ្ចូលឈ្មោះទាំង ៥ នាក់ (ដកឃ្លាគ្នា)៖</label>
        <textarea id="namesInput">សោម-ទិ អ៊ុយ-សុផល ស្វាយ-ប៊ុននី ទិត-សិទ្ធា សៀង-ប៉ាច</textarea>
    </div>

    <button class="btn-random" onclick="generateCycle()">🎲 ចាប់ឈ្មោះចៃដន្យ និងរៀបតារាង</button>

    <table class="duty-table">
        <thead>
            <tr>
                <th>ល.រ</th>
                <th>នាម និង គោត្តនាម</th>
                <th colspan="6">កាលបរិច្ឆេទយាម (រំលង ៤ ថ្ងៃម្តង)</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    function generateCycle() {
        let names = document.getElementById('namesInput').value.trim().split(/\s+/).filter(n => n);
        
        if (names.length !== 5) {
            alert("សូមបញ្ចូលឈ្មោះឱ្យបានចំចំនួន ៥ នាក់ ដើម្បីឱ្យត្រូវនឹង Cycle រំលង ៤ ថ្ងៃ!");
            return;
        }

        // ១. ច្របល់ឈ្មោះ (Randomize Names)
        for (let i = names.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [names[i], names[j]] = [names[j], names[i]];
        }

        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';
        const totalDays = 30; // គិតក្នុងរយៈពេល ៣០ ថ្ងៃ

        // ២. រៀបឈ្មោះចូលតារាងតាមលំដាប់ដែលបាន Random
        names.forEach((name, index) => {
            let row = `<tr>`;
            row += `<td>${(index + 1).toString().padStart(2, '0')}</td>`;
            row += `<td class="name-cell">${name}</td>`;

            let dutyDays = [];
            // មនុស្សទី១ ចាប់ផ្តើមថ្ងៃទី១, ទី២ ថ្ងៃទី២...
            // ម្នាក់ៗបូកម្តង ៥ ថ្ងៃ (ធ្វើ ១ សម្រាក ៤)
            let day = index + 1; 
            while (day <= totalDays) {
                dutyDays.push(day.toString().padStart(2, '0'));
                day += 5; 
            }

            // បង្ហាញក្នុងតារាង ៦ ក្រឡា
            for (let i = 0; i < 6; i++) {
                row += `<td>${dutyDays[i] || ''}</td>`;
            }
            
            row += `</tr>`;
            tableBody.innerHTML += row;
        });
    }

    // Run ដំបូង
    window.onload = generateCycle;
</script>

</body>
</html>
