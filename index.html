<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគ្រប់គ្រងការប្រចាំការ</title>
    <style>
        body { font-family: 'Leelawadee UI', Arial, sans-serif; background: #eef2f3; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; width: 100%; max-width: 900px; padding: 30px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); border-top: 5px solid #003366; }
        h2 { text-align: center; color: #003366; text-transform: uppercase; margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        .setup-section { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .input-box { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; color: #333; font-size: 14px; }
        textarea { padding: 10px; border: 1px solid #ccc; border-radius: 5px; height: 80px; resize: none; font-family: inherit; }
        
        .main-btn { grid-column: span 3; padding: 12px; background: #003366; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; transition: 0.3s; }
        .main-btn:hover { background: #0055aa; }

        .duty-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        .duty-table th, .duty-table td { border: 1px solid #333; padding: 10px; text-align: center; }
        .duty-table th { background: #f2f2f2; color: #003366; }
        .group-header { background: #e8f0fe !important; font-weight: bold; text-align: left !important; padding-left: 15px; font-size: 16px; }
        
        .print-btn { background: #28a745; margin-top: 20px; width: 100px; padding: 8px; color: white; border: none; border-radius: 4px; cursor: pointer; float: right; }

        @media print {
            .setup-section, .print-btn { display: none; }
            .container { box-shadow: none; border: none; width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>តារាងបែងចែក ប្រចាំបញ្ជា ប្រចាំការ និង ប្រចាំថ្ងៃ</h2>
    
    <div class="setup-section">
        <div class="input-box">
            <label>១. ក្រុមប្រចាំបញ្ជា (ឈ្មោះដកឃ្លាគ្នា)</label>
            <textarea id="group1" placeholder="ឧទាហរណ៍៖ សុខា តារា បុប្ផា..."></textarea>
        </div>
        <div class="input-box">
            <label>២. ក្រុមប្រចាំការ</label>
            <textarea id="group2" placeholder="ឧទាហរណ៍៖ វិបុល ស្រីនាថ..."></textarea>
        </div>
        <div class="input-box">
            <label>៣. ក្រុមប្រចាំថ្ងៃ</label>
            <textarea id="group3" placeholder="ឧទាហរណ៍៖ មុន្នី ចិន្តា..."></textarea>
        </div>
        <button class="main-btn" onclick="generateSchedule()">រៀបចំតារាងប្រចាំការ</button>
    </div>

    <table class="duty-table" id="rosterTable">
        <thead>
            <tr>
                <th width="10%">ល.រ</th>
                <th width="30%">នាម និង គោត្តនាម</th>
                <th colspan="6">ថ្ងៃអនុវត្តការងារ (កាលបរិច្ឆេទ)</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
    
    <button class="print-btn" onclick="window.print()">បោះពុម្ព (Print)</button>
</div>

<script>
    function generateSchedule() {
        const g1 = document.getElementById('group1').value.trim().split(/\s+/).filter(n => n);
        const g2 = document.getElementById('group2').value.trim().split(/\s+/).filter(n => n);
        const g3 = document.getElementById('group3').value.trim().split(/\s+/).filter(n => n);
        
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';

        if(g1.length > 0) addGroupToTable("ប្រចាំបញ្ជា", g1);
        if(g2.length > 0) addGroupToTable("ប្រចាំការ", g2);
        if(g3.length > 0) addGroupToTable("ប្រចាំថ្ងៃ", g3);
    }

    function addGroupToTable(title, members) {
        const tableBody = document.getElementById('tableBody');
        
        // បន្ថែមចំណងជើងក្រុម (Header)
        let headerRow = `<tr><td colspan="8" class="group-header">${title}</td></tr>`;
        tableBody.innerHTML += headerRow;

        // ចំនួនថ្ងៃក្នុងមួយខែ (ឧទាហរណ៍ ៣០ ថ្ងៃ)
        const totalDays = 30;

        members.forEach((name, index) => {
            let row = `<tr>`;
            row += `<td>${(index + 1).toString().padStart(2, '0')}</td>`;
            row += `<td style="text-align: left; padding-left: 10px;">${name}</td>`;
            
            // គណនាថ្ងៃប្រចាំការ (បែងចែកថ្ងៃទី ១ ដល់ ៣០ ឱ្យសមាជិកក្នុងក្រុម)
            let dutyDays = [];
            for (let d = 1; d <= totalDays; d++) {
                if ((d - 1) % members.length === index) {
                    dutyDays.push(d.toString().padStart(2, '0'));
                }
            }

            // បង្ហាញថ្ងៃប្រចាំការក្នុងប្រអប់តារាង
            for (let i = 0; i < 6; i++) {
                row += `<td>${dutyDays[i] || ''}</td>`;
            }
            
            row += `</tr>`;
            tableBody.innerHTML += row;
        });
    }

    // បង្ហាញទិន្នន័យគំរូពេលបើកដំបូង
    window.onload = function() {
        document.getElementById('group1').value = "សោម-ទិ អ៊ុយ-សុផល ស្វាយ-ប៊ុននី ទិត-សិទ្ធា សៀង-ប៉ាច";
        document.getElementById('group2').value = "ជូ-ច័ន្ទថុល វិះ-អរុណ គឹម-សែនសេរី ឃឹម-លុច អ៊ុន-ដារ៉េត";
        document.getElementById('group3').value = "សួន-ពៅ ហែម-ហាន នឿន-វណ្ណេត អ៊ុំ-វិច្ឆិ អ៊ុន-មករា";
        generateSchedule();
    }
</script>

</body>
</html>
